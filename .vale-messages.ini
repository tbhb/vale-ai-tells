# Lints the `message:` field of every rule file with the ai-tells prose style,
# so the package's own diagnostics don't contain the patterns they flag.
# tools/lint-messages.sh copies each message into a scratch .md file and runs
# vale over those with this config, so the section binds Markdown paths.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = ai-tells
