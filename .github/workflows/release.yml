---
# Release pipeline. Fires on every `v*` tag push: builds the three Vale
# package zips through `mise run build-package` (the task stays the single
# definition of the package layout), extracts the tag's section from
# CHANGELOG.md as the release notes, and publishes the GitHub release
# with the `gh` CLI under the workflow's own token, with no third-party
# release action. `contents: write` is scoped to the job; the workflow
# default stays read-only.
#
# Asset names are consumer-visible: other repositories pin
# ai-tells.zip, ai-tells-commits.zip, and ai-tells-experimental.zip by
# tag in their own .vale.ini, so neither the names nor the tag scheme
# can change here.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# See ci.yml: without this a pin can move without its lockfile entry.
env:
  MISE_LOCKED: "1"

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Build the packages
        run: mise run build-package

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag
          ' CHANGELOG.md \
            | sed -E '/^<!-- vale (off|on) -->$/d' \
            | awk 'NF{found=1} found' \
            > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for v${VERSION}" >&2
            exit 1
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            ai-tells.zip ai-tells-commits.zip ai-tells-experimental.zip \
            --title "$TAG" \
            --notes-file release-notes.md
