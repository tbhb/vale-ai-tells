---
# Secret scanning. gitleaks walks the full commit history and the working
# tree against its bundled rule set, so a credential committed anywhere in
# the repo's past fails the gate. Runs on every pull request and push to
# `main`, plus a daily cron that catches rules added to gitleaks after a
# commit merged. The gate is the shared `repotools:gitleaks` task, which
# pins the binary through the vendored payload and asserts the walk
# reached a commit -- gitleaks otherwise exits 0 on a git failure and an
# empty scan reads as a clean one.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "26 6 * * *"

permissions:
  contents: read

# See ci.yml: without this a pin can move without its lockfile entry.
env:
  MISE_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit's diff, not just
          # the checkout tip.
          fetch-depth: 0
          persist-credentials: false

      # Installs gitleaks at the version and digest the vendored payload
      # pins, the same way every other gate here resolves its binary.
      - name: Set up the toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Scan for committed secrets
        run: mise run repotools:gitleaks
