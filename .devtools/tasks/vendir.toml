# The vendir drift gate. Same task-file syntax, namespace, selection,
# and pin rules as format.toml in this directory -- with two twists.
#
# devtools itself does not include this file: it is the publisher, so
# it has no vendir.yml and nothing vendored to check. Selection working
# in both directions is the point of the includes channel.
#
# And vendir is deliberately not pinned in the shared baseline drop-in.
# A consumer needs vendir before the first sync ever runs -- the
# bootstrap task is `vendir sync` then `mise install` -- so the pin has
# to live in the consumer's own root mise.toml, ahead of the payload.

# vendir has no check mode, so drift detection is a resync compared
# against the git index. The index rather than HEAD, because the
# pre-commit hook runs this on the very commit that updates the
# vendored payload, when the fresh sync sits staged but uncommitted --
# compared against HEAD, that commit could never pass its own gate. An
# unsynced upstream bump still fails: the sync rewrites the worktree
# and the index no longer matches it. The separate untracked check
# exists because a file the sync newly adds is untracked, and untracked
# files never fail a diff -- without it the gate would stay green while
# the working tree held unreviewed payload. This only works because the
# vendored content is committed.
#
# The sync runs under a scrubbed git environment. git hands every hook
# it invokes an absolute GIT_DIR, and vendir fetches by initializing a
# throwaway repository, so those variables redirect its `git init` and
# the `git remote add origin` after it onto the consuming repository.
# What that does next depends on the consumer. Where origin already
# exists the add fails and the sync dies on `remote origin already
# exists`, which is the loud case. Where it doesn't, the add succeeds
# and the sync goes on to fetch devtools into the consuming repository
# and check it out, leaving HEAD detached on a devtools commit with
# origin rewritten -- a silent one, and the reason this is scrubbed
# rather than worked around. The task passes from a shell and under
# `prek run --all-files`, and fails only when git itself runs the hook,
# which is why a manual run never surfaces it.
#
# Scrub for the sync alone. The comparisons below need the hook's own
# environment, because GIT_INDEX_FILE is what points them at the index
# git handed the hook -- during a commit that is the pending index.lock
# -- and reading that staged index rather than HEAD is the whole reason
# the gate can pass on the commit that updates the payload. GIT_DIR is
# the variable observed to do the damage; the rest of the family goes
# with it because any one of them redirects the same `git init`.
["devtools:check-vendored"]
description = "Resync the vendored payload and fail if it drifted from what git holds"
run = '''
#!/usr/bin/env bash
set -euo pipefail
env -u GIT_DIR -u GIT_COMMON_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE \
    -u GIT_OBJECT_DIRECTORY vendir sync
rc=0
git diff --stat --exit-code -- vendir.yml vendir.lock.yml .config/mise/conf.d .devtools || rc=1
untracked=$(git ls-files --others --exclude-standard -- .config/mise/conf.d .devtools)
if [ -n "$untracked" ]; then
  printf '?? %s\n' $untracked
  rc=1
fi
if [ "$rc" -ne 0 ]; then
  echo "vendored payload drifted from what git holds -- review the resync above, then stage and commit it or fix vendir.yml" >&2
  exit 1
fi
echo "vendored payload matches what git holds"
'''
