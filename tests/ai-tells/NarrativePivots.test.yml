  contains: "'moved the goalposts'"

- name: shifted the paradigm
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: The runtime shifted the paradigm for deploys.
  contains: "'shifted the paradigm'"

- name: concrete change
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: The patch changed the cache layout and the lock order.
  absent: ai-tells.NarrativePivots
