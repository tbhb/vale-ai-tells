  contains: "'it all came together'"

- name: fell into place
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: Slowly, things fell into place.
  contains: "'things fell into place'"

- name: changed the game
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: The new allocator changed the game for latency.
  contains: "'changed the game'"

- name: rewrote the rules
  rule: ../../styles/ai-tells/NarrativePivots.yml
