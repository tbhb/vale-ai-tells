---
- name: something shifted
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: Then something shifted in the build.
  contains:
    - ai-tells.NarrativePivots
    - "'something shifted'"

- name: something clicked
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: After the third rerun, something clicked.
  contains: "'something clicked'"

- name: everything changed
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: After the release, everything changed.
  contains: "'everything changed'"

- name: that changed everything
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: The new cache landed, and that changed everything.
  contains: "'that changed everything'"

- name: it hit me
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: The log scrolled by, and then it hit me.
  contains: "'and then it hit me'"

- name: made all the difference
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: A single index, and that made all the difference.
  contains: "'and that made all the difference'"

- name: but then I realized
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: I planned a rewrite, but then I realized the loop was fine.
