  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: Reading the trace, a light bulb went off.
  contains: "'a light bulb went off'"

- name: penny dropped
  rule: ../../styles/ai-tells/NarrativePivots.yml
  input: Then the penny dropped.
  contains: "'the penny dropped'"

- name: all came together
  rule: ../../styles/ai-tells/NarrativePivots.yml
