- name: stand alone adjective stays quiet
  about: >-
    The lookbehind on the bare-verb token excludes the adjective use,
    "a stand alone top-level window."
  rule: ../../styles/ai-tells/AnthropomorphicJustification.yml
  input: The script opens a stand alone window.
  absent: ai-tells.AnthropomorphicJustification

- name: person with a job
  about: >-
    The comment declines a bare "for a living" token because a person
    writing for a living is ordinary English.
  rule: ../../styles/ai-tells/AnthropomorphicJustification.yml
  input: She writes for a living and maintains the style guide.
  absent: ai-tells.AnthropomorphicJustification

- name: names stays with its own rule
  about: >-
    The comment rejects the "names" verb here; BareNames owns it.
  rule: ../../styles/ai-tells/AnthropomorphicJustification.yml
  input: IsDir reports whether the path names a directory.
  absent: ai-tells.AnthropomorphicJustification

- name: wants stays uncovered
  about: >-
    The comment leaves "wants" with an inanimate subject uncovered
    because the standard libraries use it freely.
  rule: ../../styles/ai-tells/AnthropomorphicJustification.yml
  input: The scheduler wants to preempt the goroutine.
  absent: ai-tells.AnthropomorphicJustification

- name: literal paper claim
  about: >-
    The claiming family is gated on the trophy object, so a paper that
    claims a result stays clean.
  rule: ../../styles/ai-tells/AnthropomorphicJustification.yml
  input: The paper claims a result that the data does not support.
  absent: ai-tells.AnthropomorphicJustification
