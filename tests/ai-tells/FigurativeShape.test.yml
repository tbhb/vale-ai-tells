  rule: ../../styles/ai-tells/FigurativeShape.yml
  input: Those two numbers pick the review shape.
  contains:
    - ai-tells.FigurativeShape
    - "'the review shape'"

- name: modifier in the determiner slot
  rule: ../../styles/ai-tells/FigurativeShape.yml
  input: The loader rejects the wrong shape of input.
  contains: "'the wrong shape'"

- name: shape of with a determined complement
  rule: ../../styles/ai-tells/FigurativeShape.yml
  input: Document shape of the parse trees before coding.
  contains: "'shape of the '"

- name: gerund verb
  rule: ../../styles/ai-tells/FigurativeShape.yml
  input: The council is shaping the direction of the API.
  contains: "'shaping the'"

- name: relative verb
  rule: ../../styles/ai-tells/FigurativeShape.yml
  input: Check what shapes the output of the formatter.
  contains: "'what shapes the'"

- name: hyphenated compound
  rule: ../../styles/ai-tells/FigurativeShape.yml
  input: The linter flags code-shaped prose in comments.
  contains: "'code-shaped'"

- name: gated plural
  rule: ../../styles/ai-tells/FigurativeShape.yml
