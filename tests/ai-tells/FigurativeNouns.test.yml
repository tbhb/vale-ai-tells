  contains: "'blind spot'"

- name: seam between components
  rule: ../../styles/ai-tells/FigurativeNouns.yml
  input: The injection seam is thin.
  contains: "'The injection seam'"

- name: seam allowance
  rule: ../../styles/ai-tells/FigurativeNouns.yml
