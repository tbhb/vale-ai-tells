---
- name: along the way
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: We learned a lot along the way.
  contains:
    - ai-tells.JourneyMetaphors
    - "'along the way'"

- name: every step of the way
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The docs supported us every step of the way.
  contains: "'every step of the way'"

- name: most of the way there
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: That gets us most of the way there.
  contains: "'of the way there'"

- name: halfway there
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The migration is halfway there.
  contains: "'halfway there'"

- name: on its way
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: A fix is on its way.
  contains: "'on its way'"

- name: is on the way
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The patch is on the way.
  contains: "'is on the way'"

- name: more on the way
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The release adds two flags, with more on the way.
  contains: "'more on the way'"

