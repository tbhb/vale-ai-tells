- name: manner sense of way
  about: Bare "on the way" is the manner sense in the corpora, so it stays out.
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The result depends on the way the cache is built.
  absent: ai-tells.JourneyMetaphors

- name: walks the tree
  about: Walking a tree is the traversal term of art.
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The linter walks the tree once per file.
  absent: ai-tells.JourneyMetaphors

- name: a literal path
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: Set the value on the path to the config file.
  absent: ai-tells.JourneyMetaphors

- name: user journey
  about: The adjacency gate keeps the UX term of art quiet.
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The user journey map has six rows.
  absent: ai-tells.JourneyMetaphors
