  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: This change paves the way for streaming.
  contains: "'paves the way'"

- name: makes it into
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The value makes it into the index.
  contains: "'makes it into'"

- name: walks the workflow
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The tool walks the workflow one stage at a time.
  contains: "'walks the workflow'"

- name: a long way
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: A typed config goes a long way toward clean diffs.
  contains: "'a long way'"

- name: path forward
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The review found a path forward for the cache.
  contains: "'path forward'"

- name: on a path to
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The service is on a path to stability.
  contains: "'on a path to'"

- name: on the road to
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The service is on the road to recovery.
  contains: "'on the road to'"

- name: bumps in the road
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: Expect a few bumps in the road.
  contains: "'bumps in the road'"

- name: down the road
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The shortcut bites us down the road.
  contains: "'down the road'"

- name: down the line
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: The shortcut causes problems down the line.
  contains: "'down the line'"

- name: our journey
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: Our journey began with one rule.
  contains: "'Our journey'"

- name: journey from
  rule: ../../styles/ai-tells/JourneyMetaphors.yml
  input: Journey from prototype to production is the topic.
