- name: colon cheat
  about: A long definite subject, a colon, an indefinite article, and a long descriptive tail.
  rule: ../../styles/ai-tells/ServesAsDodge.yml
  input: "The candidate hook mechanism: a hook on Bash that blocks the write."
  contains: "'The candidate hook mechanism: a hook on Bash that blocks the write'"

- name: short pedagogical colon
  about: A short subject and a short tail are an answer, not the cheat.
  rule: ../../styles/ai-tells/ServesAsDodge.yml
  input: "The answer: a hook."
  absent: ai-tells.ServesAsDodge

- name: literal serve
  rule: ../../styles/ai-tells/ServesAsDodge.yml
