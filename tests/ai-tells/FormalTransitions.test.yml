---
- name: moreover
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: Moreover, the parser handles every case.
  contains:
    - ai-tells.FormalTransitions
    - "'Moreover'"

- name: furthermore
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: Furthermore, the cache stays warm.
  contains: "'Furthermore'"

- name: therefore
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: The index is stale. Therefore, the build reruns.
  contains: "'Therefore'"

- name: nevertheless
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: Nevertheless, the test passes.
  contains: "'Nevertheless'"

- name: thus
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: Thus, the cache is rebuilt.
  contains: "'Thus'"

- name: in addition
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: In addition, the loader reads the lockfile.
  contains: "'In addition'"

- name: on the contrary
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: On the contrary, the cache is cold.
  contains: "'On the contrary'"

- name: as a result
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: As a result, the build fails.
  contains: "'As a result'"

- name: for example
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: For example, the loader reads the lockfile.
  contains: "'For example'"

- name: sentence-initial specifically with a comma
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: Specifically, the loader reads the lockfile.
  contains: "'Specifically'"

- name: sentence-initial significantly after a period
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: The tests pass. Significantly, the loader reads the lockfile.
  contains: "'Significantly'"

- name: mid-sentence specifically
  about: The manner adverb flags only as a sentence-initial transition with a trailing comma.
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: The loader is specifically designed for lockfiles.
  absent: ai-tells.FormalTransitions

- name: mid-sentence significantly
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: The loader runs significantly faster than before.
  absent: ai-tells.FormalTransitions

- name: sentence-initial essentially with a comma
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: Essentially, the loader reads the lockfile.
  contains: "'Essentially'"

- name: sentence-initial fundamentally with a comma
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: Fundamentally, the loader reads the lockfile.
  contains: "'Fundamentally'"

- name: notably
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: Notably, the loader reads the lockfile.
  contains: "'Notably'"

- name: with that in mind
  rule: ../../styles/ai-tells/FormalTransitions.yml
