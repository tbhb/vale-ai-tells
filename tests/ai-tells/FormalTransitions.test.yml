  contains: "'With that in mind'"

- name: to that end
  rule: ../../styles/ai-tells/FormalTransitions.yml
  input: To that end, the loader reads the lockfile.
  contains: "'To that end'"

- name: building on this
  rule: ../../styles/ai-tells/FormalTransitions.yml
