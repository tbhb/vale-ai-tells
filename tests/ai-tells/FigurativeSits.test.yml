---
- name: conceptual-location placement
  rule: ../../styles/ai-tells/FigurativeSits.yml
  input: Pricing sits at the intersection of two fields.
  contains:
    - ai-tells.FigurativeSits
    - "'sits at the intersection of'"

- name: range placement
  rule: ../../styles/ai-tells/FigurativeSits.yml
  input: The answer sits somewhere between the two options.
  contains: "'sits somewhere between'"

- name: adverb and relational preposition
  rule: ../../styles/ai-tells/FigurativeSits.yml
  input: The feature sits squarely within scope.
  contains: "'sits squarely within'"

- name: companion placement
  rule: ../../styles/ai-tells/FigurativeSits.yml
  input: Pricing sits alongside the incumbent.
  contains: "'sits alongside'"

- name: rests-with placement
  rule: ../../styles/ai-tells/FigurativeSits.yml
  input: Ownership sits with the board.
  contains: "'sits with'"

- name: within scope
  rule: ../../styles/ai-tells/FigurativeSits.yml
  input: This sits within our remit.
  contains: "'sits within'"

- name: dormancy just sits there
  rule: ../../styles/ai-tells/FigurativeSits.yml
  input: The draft just sits there for weeks.
  contains: "'just sits there'"

- name: dormancy in isolation
  rule: ../../styles/ai-tells/FigurativeSits.yml
