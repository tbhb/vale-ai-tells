  contains: "'The third advantage'"

- name: plain ordinal in a sentence
  rule: ../../styles/ai-tells/SequencingMarkers.yml
  input: The first run failed, and the second run passed.
  absent: ai-tells.SequencingMarkers

- name: first as an adverb
  rule: ../../styles/ai-tells/SequencingMarkers.yml
  input: First, the loader reads the manifest.
