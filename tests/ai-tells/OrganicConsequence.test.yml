  contains: "'a natural consequence'"

- name: the natural result
  rule: ../../styles/ai-tells/OrganicConsequence.yml
  input: A stale index is the natural result.
  contains: "'the natural result'"

- name: naturally follows
  rule: ../../styles/ai-tells/OrganicConsequence.yml
