  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: The dust settled on the windowsill overnight.
  absent: ai-tells.FigurativeSettles

- name: control-loop convergence
  rule: ../../styles/ai-tells/FigurativeSettles.yml
