    - ai-tells.FigurativeSettles
    - "'settles the question'"

- name: gavel with a pronoun
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: A single failing test settled it.
  contains: "'settled it'"

- name: the dust settles
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: We will revisit the layout once the dust settles after the reorg.
  contains: "'the dust settles'"

- name: dust that has settled
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: The team waited until the dust had settled before merging.
  contains: "'the dust had settled'"

- name: wait for the dust to settle
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: Wait for the dust to settle before you rebase.
  contains: "'for the dust to settle'"

- name: settling into place
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: The pieces settled into place after the third rewrite.
  contains: "'settled into place'"

- name: settling into a form
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: The API settled into its final form last spring.
  contains: "'settled into its final form'"

- name: closed question as an adjective
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: The debate is settled, so the naming stays as it is.
