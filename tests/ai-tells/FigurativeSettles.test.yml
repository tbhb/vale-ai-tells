- name: settled law
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: The convention is treated as settled law in this team.
  contains: "'settled law'"

- name: settling a score
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: The patch settles an old score with the flaky suite.
  contains: "'settles an old score'"

- name: settling on a choice
  rule: ../../styles/ai-tells/FigurativeSettles.yml
  input: The team settled on a heuristic for ranking.
