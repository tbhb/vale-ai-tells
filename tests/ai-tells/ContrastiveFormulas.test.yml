  contains: "'Static analysis in CI isn't a gate. It's a signal about the design'"

- name: plain negation without a correction
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: The parser isn't thread-safe, so guard it with a mutex.
