  contains: "'These aren't bugs. They're features of the old design'"

- name: plural with a semicolon
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: "These aren't flags; they're switches for the whole run."
  contains: "'These aren't flags; they're switches for the whole run'"

- name: plural noun aren't they're
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: Defaults aren't neutral. They're a decision made for you.
  contains: "'Defaults aren't neutral. They're a decision made for you'"

