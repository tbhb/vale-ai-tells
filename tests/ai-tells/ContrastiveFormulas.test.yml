---
- name: not just then it's
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: "It's not just a linter; it's a safety net for prose."
  contains:
    - ai-tells.ContrastiveFormulas
    - "'It's not just a linter; it's a safety net for prose'"

- name: not merely with a comma
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: "It's not merely a cache, it's the whole read path."
  contains: "'It's not merely a cache, it's the whole read path'"

- name: not about then about
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: "It's not about speed; it's about trust in the output."
  contains: "'It's not about speed; it's about trust in the output'"

- name: not about across two sentences
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: It's not about speed. It's about trust in the output.
  contains: "'It's not about speed. It's about trust in the output'"

- name: this isn't just
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
