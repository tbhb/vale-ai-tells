- name: bare appositive a not a
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: The new rule is a refinement, not a rivalry with the old one.
  contains: "'a refinement, not a rivalry with the old one'"

- name: bare appositive in a heading
  about: The verbless appositive also fires where the clause-level tokens never match.
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: |
    # A refinement, not a rewrite

    Body text.
  contains: "'A refinement, not a rewrite'"

- name: not only but also
  rule: ../../styles/ai-tells/ContrastiveFormulas.yml
  input: The tool not only parses the file but also rewrites it.
  contains: "'not only parses the file but also rewrites it'"

