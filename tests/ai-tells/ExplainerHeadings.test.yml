---
- name: free-relative heading
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# Why the Pin Exists"
  contains:
    - ai-tells.ExplainerHeadings
    - "'Why the Pin Exists'"

- name: free-relative heading with how
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# How the Cache Works"
  contains:
    - ai-tells.ExplainerHeadings
    - "'How the Cache Works'"

- name: deep dive
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# Deep Dive into the Scheduler"
  contains:
    - ai-tells.ExplainerHeadings
    - "'Deep Dive'"

- name: under the hood
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# Under the Hood"
  contains:
