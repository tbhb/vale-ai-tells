- name: the inner workings
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# The Inner Workings"
  contains:
    - ai-tells.ExplainerHeadings
    - "'The Inner Workings'"

- name: conventional how-to heading
  about: >-
    The determiner gate keeps "How to Configure X" out.
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# How to Configure the Cache"
  absent: ai-tells.ExplainerHeadings

- name: whats new heading
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# What's New"
  absent: ai-tells.ExplainerHeadings

- name: topic heading
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# Cache invalidation"
  absent: ai-tells.ExplainerHeadings

- name: body text is out of scope
  about: >-
    The rule is scoped to headings, so the same phrase in a paragraph
    stays quiet.
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: This section covers why the pin exists and how the cache works.
  absent: ai-tells.ExplainerHeadings
