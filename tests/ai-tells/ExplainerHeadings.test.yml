    - ai-tells.ExplainerHeadings
    - "'Demystifying'"

- name: why it matters
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
  input: "# Why It Matters"
  contains:
    - ai-tells.ExplainerHeadings
    - "'Why It Matters'"

- name: what it solves
  rule: ../../styles/ai-tells/ExplainerHeadings.yml
