- name: noun sense of leverage
  about: The sequence rule tags the part of speech, so the noun stays quiet.
  rule: ../../styles/ai-tells/OverusedVocabularyVerbs.yml
  input: The lever gives a mechanical advantage, and the leverage is high.
  absent: ai-tells.OverusedVocabularyVerbs

- name: noun sense of harness
  rule: ../../styles/ai-tells/OverusedVocabularyVerbs.yml
