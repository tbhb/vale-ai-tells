- name: leverage as a verb
  rule: ../../styles/ai-tells/OverusedVocabularyVerbs.yml
  input: We leverage the cache to speed up lookups.
  contains:
    - ai-tells.OverusedVocabularyVerbs
    - "'leverage'"

- name: navigating as a verb
  rule: ../../styles/ai-tells/OverusedVocabularyVerbs.yml
  input: She is navigating the config files.
  contains: "'navigating'"

- name: harnesses as a verb
  rule: ../../styles/ai-tells/OverusedVocabularyVerbs.yml
  input: The tool harnesses every core on the machine.
  contains: "'harnesses'"

- name: foster as a verb
  rule: ../../styles/ai-tells/OverusedVocabularyVerbs.yml
  input: We foster shared ownership of the code.
  contains: "'foster'"

- name: spearheading as a verb
  rule: ../../styles/ai-tells/OverusedVocabularyVerbs.yml
