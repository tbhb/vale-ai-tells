- name: happy to help
  rule: ../../styles/ai-tells/SycophancyMarkers.yml
  input: I'd be happy to help with the migration.
  contains: "'I'd be happy to help'"

- name: absolutely
  rule: ../../styles/ai-tells/SycophancyMarkers.yml
  input: Absolutely, the parser accepts that flag.
  contains: "'Absolutely'"

- name: certainly
  rule: ../../styles/ai-tells/SycophancyMarkers.yml
