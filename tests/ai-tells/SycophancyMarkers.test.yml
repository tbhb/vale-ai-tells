    - ai-tells.SycophancyMarkers
    - "'Great question'"

- name: excellent question
  rule: ../../styles/ai-tells/SycophancyMarkers.yml
  input: That's an excellent question about caching.
  contains: "'That's an excellent question'"

- name: glad you asked
  rule: ../../styles/ai-tells/SycophancyMarkers.yml
  input: I'm glad you asked, because the docs skip this.
