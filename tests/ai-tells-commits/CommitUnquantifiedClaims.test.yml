---
- name: significantly faster
  rule: ../../styles/ai-tells-commits/CommitUnquantifiedClaims.yml
  format: txt
  input: |
    perf(parser): cache tokens

    The lexer is significantly faster on large files.
  contains:
    - ai-tells-commits.CommitUnquantifiedClaims
    - "'significantly faster'"

- name: dramatically reduced
  rule: ../../styles/ai-tells-commits/CommitUnquantifiedClaims.yml
  format: txt
  input: |
    perf(parser): cache tokens

    Allocations are dramatically reduced.
  contains: "'dramatically reduced'"

- name: much faster
  rule: ../../styles/ai-tells-commits/CommitUnquantifiedClaims.yml
