    Lexing a 10 MB file drops from 480 ms to 310 ms.
  absent: ai-tells-commits.CommitUnquantifiedClaims

- name: modifier without a comparative
  rule: ../../styles/ai-tells-commits/CommitUnquantifiedClaims.yml
