---
- name: test counts
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  input: |
    fix(parser): handle empty input

    All 42 tests pass.
  contains:
    - ai-tells-commits.CommitTestEnumeration
    - "'All 42 tests pass'"

- name: coverage label
  about: >-
    The percent sign is written as \x25 in the rule, because Vale 3.24
    reads a %% escape literally.
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  input: |
    fix(parser): handle empty input

    Coverage: 87%
  contains: "'Coverage: 87%'"

- name: coverage figure
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  input: |
    fix(parser): handle empty input

    Reaches 100% test coverage.
  contains: "'100% test coverage'"

- name: describes the change
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  input: |
    fix(parser): handle empty input

    An empty file returned a nil tree, which the caller dereferenced.
  absent: ai-tells-commits.CommitTestEnumeration

- name: tests passing with a count
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  format: txt
  input: |
    fix(parser): handle empty input

    12 tests passing after the change.
  contains: "'12 tests passing'"

- name: tests failing
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  format: txt
  input: |
    fix(parser): handle empty input

    3 tests failed before the change.
  contains: "'3 tests failed'"

- name: passed and failed counts
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  format: txt
  input: |
    fix(parser): handle empty input

    Result: 40 passed, 2 failed.
  contains: "'40 passed, 2 failed'"

- name: all tests green
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  format: txt
  input: |
    fix(parser): handle empty input

    All tests green.
  contains: "'All tests green'"

- name: check emoji before all tests
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  format: txt
  input: |
    fix(parser): handle empty input

    ✅ all tests
  contains: "'✅ all tests'"

- name: coverage percent before the noun
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  format: txt
  input: |
    fix(parser): handle empty input

    Raises line coverage to 91.5% line coverage.
  contains: "'91.5% line coverage'"

- name: describes a new test case
  rule: ../../styles/ai-tells-commits/CommitTestEnumeration.yml
  format: txt
  input: |
    test(parser): cover empty input

    Adds a case that feeds an empty file to the parser.
  absent: ai-tells-commits.CommitTestEnumeration
