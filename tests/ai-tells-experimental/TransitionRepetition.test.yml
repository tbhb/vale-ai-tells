- name: two uses stay under the limit
  rule: ../../styles/ai-tells-experimental/TransitionRepetition.yml
  input: |
    # Setup

    The cache is fast. Moreover, it is small. Moreover, it is safe to clear. It needs no setup.
  absent: ai-tells-experimental.TransitionRepetition

- name: a connector outside the list
  about: Only the listed transitions count, so "however" repeated three times stays quiet.
  rule: ../../styles/ai-tells-experimental/TransitionRepetition.yml
  input: |
    # Setup

    The cache is fast. However, it is small. However, it is hard to clear. However, it needs setup.
  absent: ai-tells-experimental.TransitionRepetition

- name: hence inside henceforth
  about: The pattern is word-bounded, so "henceforth" does not count as "hence".
  rule: ../../styles/ai-tells-experimental/TransitionRepetition.yml
  input: |
    # Setup

    The cache is fast. Henceforth, it is small. Henceforth, it is safe to clear. Henceforth, it needs no setup.
  absent: ai-tells-experimental.TransitionRepetition

- name: repeats split across two sections
  rule: ../../styles/ai-tells-experimental/TransitionRepetition.yml
  input: |
    # Install

    The cache is fast. Moreover, it is small. Moreover, it is safe to clear.

    # Operate

    The queue is slow. Moreover, it is large. Moreover, it needs setup.
  absent: ai-tells-experimental.TransitionRepetition

- name: repeats inside a code fence
