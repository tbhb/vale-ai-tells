- name: four paragraphs of near-equal length
  rule: ../../styles/ai-tells-experimental/ParagraphLengthVariance.yml
  input: |
    # Setup

    The installer copies the binary into the local bin directory of the user and sets the permissions on the file so that the shell can run it without any extra steps from the person doing the install.

    The updater downloads the archive into the cache directory of the project and checks the signature on the bundle so that the pipeline can trust it without any manual steps from the person doing the release.

    The linter reads the config from the root folder of the repository and reports the findings on each line so that the reviewer can fix them without any extra tools from the person who wrote the change.

    The scheduler starts the worker at the top of the hour and records the exit status in the log so that the operator can inspect it without any special access from the person running the cluster.
