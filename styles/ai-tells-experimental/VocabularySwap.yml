  elucidating: explaining|clarifying
  elucidated: explained|clarified
  elevate: raise|improve|increase
  elevates: raises|improves|increases
  elevating: raising|improving|increasing
  #\s+elevated\s+-ed\s+key\s+omitted\s+on\s+purpose: "elevated privileges/permissions"
  # is a settled technical adjective, so the past-tense swap would misfire.
  reimagine: rethink|redesign|redo
  reimagines: rethinks|redesigns|redoes
  reimagining: rethinking|redesigning|redoing
  reimagined: rethought|redesigned|redid
  encompass: include|cover
  encompasses: includes|covers
  encompassing: including|covering
