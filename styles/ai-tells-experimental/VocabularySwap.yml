---
extends: substitution
message: "AI vocabulary: use %s instead of '%s'."
level: warning
ignorecase: true
swap:
  delve: examine|look at|cover
  delves: examines|looks at|covers
  delving: examining|looking at|covering
  delved: examined|looked at|covered
  utilize: use
  utilizes: uses
  utilizing: using
  utilized: used
  utilization: use
  facilitate: help|enable|support
  facilitates: helps|enables|supports
  facilitating: helping|enabling|supporting
  facilitated: helped|enabled|supported
  commence: start|begin
  commences: starts|begins
  commencing: starting|beginning
  commenced: started|began
  terminate: end|stop
  terminates: ends|stops
  terminating: ending|stopping
  terminated: ended|stopped
  ascertain: find out|determine|learn
  endeavor: effort|attempt|try
  endeavors: efforts|attempts|tries
  endeavour: effort|attempt|try
  endeavours: efforts|attempts|tries
  endeavored: attempted|tried
  endeavoured: attempted|tried
  leverage: use|apply|build on
  leverages: uses|applies|builds on
  leveraging: using|applying|building on
  leveraged: used|applied|built on
  streamline: simplify|speed up
  streamlines: simplifies|speeds up
  streamlining: simplifying|speeding up
  #\s+streamlined\s+-ed\s+key\s+omitted\s+on\s+purpose: "streamlined process/pipeline"
  # is a settled technical adjective, so the past-tense swap would misfire.
  bolster: strengthen|support|boost
  bolsters: strengthens|supports|boosts
  bolstering: strengthening|supporting|boosting
  bolstered: strengthened|supported|boosted
  elucidate: explain|clarify
