---
extends: existence
message: "AI commit tell: '%s'. State what changed and why, not marketing copy."
level: error
ignorecase: true
# The hyphenated forms 'state-of-the-art', 'best-in-class', 'world-class',
# and 'cutting-edge' are intentionally omitted — ai-tells.OverusedVocabulary
# and ai-tells.AICompoundPhrases already cover them, and the README directs
# users to layer both styles on commit messages.
tokens:
  - production-ready
  - production\s+ready
  - enterprise-grade
  - enterprise\s+grade
  - mission-critical
  - mission\s+critical
  - world\s+class
  - state\s+of\s+the\s+art
  - cutting\s+edge
  - best\s+in\s+class
  - industry-standard
  - industry\s+standard
  - battle-tested
  - battle\s+tested
  - rock-solid
  - rock\s+solid
  - bulletproof
  # 'first-class' / 'first class' omitted: standard CS terminology
  # (first-class functions, first-class support) with no marketing sense.
  - top-tier
  - top\s+tier
  - highly\s+scalable
  - fault-tolerant
  - fault\s+tolerant
  - carefully\s+crafted
  - meticulously\s+crafted
  - elegantly\s+designed
