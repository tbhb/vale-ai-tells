---
extends: existence
message: "AI commit tell: '%s'. Cut this filler. The message reads the same without it."
level: error
ignorecase: true
tokens:
  # "as part of" filler
  - as\s+part\s+of\s+this\s+change
  - as\s+part\s+of\s+this\s+commit
  - as\s+part\s+of\s+this\s+update
  - as\s+part\s+of\s+this\s+PR
  - as\s+part\s+of\s+this\s+pull\s+request
  - as\s+part\s+of\s+this\s+refactor
  - as\s+part\s+of\s+this\s+effort
  - as\s+part\s+of\s+this\s+migration
  - as\s+part\s+of\s+this\s+work

  # "this is necessary" explanations
  - this\s+is\s+necessary\s+because
  - this\s+was\s+necessary\s+because
  - this\s+is\s+needed\s+because
  - this\s+was\s+needed\s+because
  - this\s+is\s+needed\s+to
  - this\s+was\s+needed\s+to
  - this\s+is\s+required\s+because
  - this\s+was\s+required\s+to
  - this\s+is\s+necessary\s+to\s+ensure
  - this\s+was\s+necessary\s+to\s+ensure

  # "along with" padding
  - along\s+with\s+necessary
  - along\s+with\s+corresponding
  - along\s+with\s+related
  - along\s+with\s+relevant
  - along\s+with\s+associated
  - along\s+with\s+appropriate
  - along\s+with\s+updated

  # Diff narration phrases
  - the\s+following\s+changes\s+were\s+made
  - the\s+following\s+changes\s+have\s+been\s+made
  - the\s+following\s+modifications\s+were\s+made
  - changes\s+include
  - changes\s+made\s+include
  - the\s+key\s+changes\s+are
  - the\s+main\s+changes\s+are
  - the\s+notable\s+changes\s+are
  - summary\s+of\s+changes

  # Unnecessary scope framing
  - the\s+goal\s+of\s+this\s+change
  - the\s+purpose\s+of\s+this\s+change
  - the\s+purpose\s+of\s+this\s+commit
  - the\s+goal\s+of\s+this\s+commit
  - the\s+intent\s+of\s+this\s+change
  - the\s+motivation\s+for\s+this\s+change
  - the\s+reason\s+for\s+this\s+change
  - the\s+rationale\s+behind\s+this
