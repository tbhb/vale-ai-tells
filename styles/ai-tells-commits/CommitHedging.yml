---
extends: existence
message: "AI commit tell: '%s'. You already made the change. Don't hedge about whether it works; state what you tested instead."
level: error
ignorecase: true
tokens:
  # "should" hedges
  - This\s+should\s+fix
  - This\s+should\s+resolve
  - This\s+should\s+address
  - This\s+should\s+prevent
  - This\s+should\s+improve
  - This\s+should\s+help
  - This\s+should\s+handle
  - should\s+fix\s+the
  - should\s+resolve\s+the
  - should\s+address\s+the
  - should\s+prevent\s+the
  - should\s+improve\s+the
  - should\s+help\s+with

  # "may/might" hedges
  - This\s+may\s+fix
  - This\s+may\s+help
  - This\s+may\s+resolve
  - This\s+may\s+improve
  - This\s+might\s+fix
  - This\s+might\s+help
  - This\s+might\s+resolve
  - This\s+might\s+improve

  # "helps to" hedges
  - This\s+helps\s+to
  - This\s+helps\s+with
  - This\s+helps\s+ensure
  - This\s+helps\s+prevent
  - helps\s+to\s+ensure
  - helps\s+to\s+prevent
  - helps\s+to\s+improve
  - helps\s+to\s+reduce
  - helps\s+to\s+avoid

  # "appears to" / "seems to" hedges
  - appears\s+to\s+fix
  - appears\s+to\s+resolve
  - seems\s+to\s+fix
  - seems\s+to\s+resolve
  - seems\s+to\s+work
  # bare 'seems to be' dropped: it fires on diagnostic prose ("the root
  # cause seems to be a race"). Pair it with a resolution object so only
  # the effect-hedging sense matches, like the siblings above.
  - seems\s+to\s+be\s+fixed
  - seems\s+to\s+be\s+resolved
  - seems\s+to\s+be\s+working
