---
extends: existence
message: "AI quantity metaphor: '%s'. Give the count, or write 'a few' or 'many'."
level: error
ignorecase: true
# Quantity expressed through a physical metaphor instead of a number: a
# body part ("a handful of tests"), a container or vehicle ("a boatload of
# options"), weather or water ("a flood of alerts"), or a fancy Greek or
# Latin stand-in ("a plethora of features"). Each one dodges the count the
# sentence wanted, and each one is what a model reaches for when told to
# remove one of the others, so the whole substitution pool lives under one
# rule and one message. "A myriad of," "a plethora of," and "a wealth of"
# migrated here from FillerPhrases for that reason.
#
# Corpus notes, measured against the Go and Python standard libraries:
# "a handful" appears 14 times as the ordinary human idiom for a small
# count, so this is a flag-hard token by the maintainer's call rather than
# a pure fingerprint; the hidden count is the tell. "A host of"
# measured once, and that one is the literal network host ("A host of ''
# or port 0" in socket.py), so networking prose about hosts should
# disable the rule, as should memory-management prose, where objects
# really do sit on a heap. "A heap of" measured four, "tons of" three,
# "a ton of" two, "a flurry of" once, and everything else zero.
tokens:
  # --- Small counts: the body-part and kitchen dodges for "a few."
  - a\s+handful
  - the\s+handful\s+of
  - handfuls\s+of
  - a\s+fistful\s+of
  - an\s+armful\s+of
  - a\s+smattering
  - a\s+sprinkling\s+of
  - a\s+sliver\s+of
  - a\s+dash\s+of
  - a\s+pinch\s+of
  - a\s+dollop\s+of

  # --- Large counts: the crowd nouns standing in for "many."
  - a\s+slew\s+of
  - a\s+(?:whole\s+)?host\s+of
  - a\s+raft\s+of
  - a\s+spate\s+of
  - a\s+flurry\s+of
  - a\s+litany\s+of
  - a\s+laundry\s+list\s+of
  - a\s+bevy\s+of
  - a\s+grab\s+bag\s+of

  # --- Container, vehicle, and landform scale.
  - a\s+boatload\s+of
  - boatloads\s+of
  - a\s+truckload\s+of
  - truckloads\s+of
  - a\s+ton\s+of
  - tons\s+of
  - a\s+heap\s+of
  - heaps\s+of
  - a\s+pile\s+of
  - a\s+mountain\s+of

  # --- Weather and water scale.
  - a\s+sea\s+of
  - an\s+ocean\s+of
  - a\s+flood\s+of
  - a\s+wave\s+of
  - a\s+deluge\s+of
  - a\s+torrent\s+of
  - an\s+avalanche\s+of

  # --- The fancy vague quantities, migrated from FillerPhrases.
  - a\s+myriad\s+of
  - a\s+plethora\s+of
  - a\s+wealth\s+of
  - a\s+trove\s+of

  # --- Variety in place of quantity: a mixture metaphor where a plain list
  # of what is actually in the mix would serve.
  - a\s+smorgasbord\s+of
  - a\s+cornucopia\s+of
  - a\s+medley\s+of
  - a\s+patchwork\s+of
  - a\s+mosaic\s+of
  - a\s+constellation\s+of

  # --- "Array" only when an adjective inflates it. The bare noun is
  # literal everywhere in technical prose, so it stays uncovered.
  - an?\s+(?:vast|wide|broad|whole|dizzying|impressive|endless|bewildering)\s+array\s+of

  # --- Distance standing in for a count ("how far one label reaches,"
  # "how far the item copied across the corpus," "how far these numbers
  # travel"). Added after a documentation-corpus audit (2026-09); the
  # token measures zero across the Go and Python standard libraries.
  - how\s+far\s+(?:a|an|the|this|that|these|those|each|every|its|their|one|any|some)\s+(?:[a-z'-]+\s+)?[a-z]+\s+(?:reach(?:es|ed)?|travel(?:s|l?ed)?|copied|copies|spread|spreads|propagat(?:es|ed)|carr(?:ies|ied|y)|go(?:es)?|went|extends?|extended)
