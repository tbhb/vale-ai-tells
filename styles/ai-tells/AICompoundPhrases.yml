  - real\s+choices
  - real\s+options
  - real\s+differences

  # Investigation-thread metaphors: AI's preferred way to describe
  # "open questions" or "loose ends." Tutorial-blog tone.
  - threads\s+to\s+pull\s+on
  - thread\s+to\s+pull\s+on
  - threads\s+to\s+pull
  - thread\s+to\s+pull
  - loose\s+threads\s+to\s+pull
  - loose\s+threads\s+to\s+chase
  - another\s+thread\s+to\s+pull
  - more\s+threads\s+to\s+pull

  # Solidification metaphors: the surface/design/contract "hardens"
  # before some deadline. AI reaches for this constantly when
  # describing in-progress work or pre-release windows.
  # Broad regex catches "before/after X hardens" for any 1-6
  # word X.
  - (?:before|after)\s+[^.,;:!?]{1,40}\s+hardens
  - (?:before|after)\s+[^.,;:!?]{1,40}\s+hardened
  - (?:before|after)\s+[^.,;:!?]{1,40}\s+solidifies
  - (?:before|after)\s+[^.,;:!?]{1,40}\s+solidified
  - (?:before|after)\s+[^.,;:!?]{1,40}\s+ossifies
  - (?:before|after)\s+[^.,;:!?]{1,40}\s+ossified
