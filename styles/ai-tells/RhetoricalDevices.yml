---
extends: existence
message: "AI rhetoric: '%s'. Remove it or rephrase as a plain statement."
level: error
nonword: true
tokens:
  # "When [verb]ing X, ask: [question]" - the imperative test pattern
  - "\\bWhen\\s+\\w+ing\\s+[^,]+,\\s+ask:"
  - "\\bWhen\\s+you\\s+\\w+\\s+[^,]+,\\s+ask:"
  - "\\bBefore\\s+\\w+ing\\s+[^,]+,\\s+ask:"

  # "The test:" section-ending pattern
  - "\\bThe\\s+test:"
  - "\\bThe\\s+test\\s+is:"
  - "\\bThe\\s+litmus\\s+test:"
  - "\\bHere'?s\\s+the\\s+test:"
  - "\\bA\\s+good\\s+test:"
  - "\\bThe\\s+acid\\s+test:"

  # "This gives you a concrete test" and similar
  - "\\b[Tt]his\\s+gives\\s+you\\s+a\\s+(?:concrete|simple|good|useful|quick)\\s+test\\b"

  # "Ask yourself:" pattern
  - "\\bAsk\\s+yourself:"
  - "\\bAsk\\s+yourself\\s+whether\\b"
  - "\\bAsk\\s+yourself\\s+if\\b"
  - "\\bThe\\s+question\\s+to\\s+ask:"
  - "\\bThe\\s+question\\s+to\\s+ask\\s+is:"

  # The "The X:" dramatic-colon labels moved to LabelAndExplain, which owns
  # the "Label: sentence" construction.
