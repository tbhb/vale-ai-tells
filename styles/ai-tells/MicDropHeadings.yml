---
extends: existence
message: "AI mic-drop: '%s'. Use a descriptive heading instead."
level: error
nonword: true
scope: heading
tokens:
  # "X, not Y" / "X, never Y"
  - "\\b[A-Z][a-z]+,\\s+not\\s+[a-z]+"
  - "\\b[A-Z][a-z]+,\\s+never\\s+[a-z]+"

  # "X, then Y"
  - "\\b[A-Z][a-z]+,\\s+then\\s+[a-z]+"

  # "X over Y"
  - "\\b[A-Z][a-z]+\\s+over\\s+[a-z]+"

  # "X first, Y second"
  - "\\b[A-Z][a-z]+\\s+first,\\s+[a-z]+\\s+second\\b"
  - "\\b[A-Z][a-z]+\\s+first,\\s+[a-z]+\\s+never\\b"
