---
extends: existence
message: "AI staccato: '%s'. Combine these clipped parallel sentences or vary the structure."
level: error
nonword: true
tokens:
  # === Parallel pairs (any verb — the structure is the tell) ===

  # "Noun verbs. Noun verbs."
  # "Shippers scan. Practitioners read." "Engineers build. Managers ship."
  - "\\b[A-Z][a-z]+\\s+[a-z]+s?\\.\\s+[A-Z][a-z]+\\s+[a-z]+s?\\."

  # "The noun verbs. The noun verbs."
  - "\\bThe\\s+[a-z]+\\s+[a-z]+s?\\.\\s+The\\s+[a-z]+\\s+[a-z]+s?\\."

  # "Noun verb-phrase. Noun doesn't/don't."
  # "Content carries the personality. Chrome doesn't."
  - "\\b[A-Z][a-z]+\\s+[^.!?]+\\.\\s+[A-Z][a-z]+\\s+doesn'?t\\."
  - "\\b[A-Z][a-z]+\\s+[^.!?]+\\.\\s+[A-Z][a-z]+\\s+don'?t\\."
  - "\\b[A-Z][a-z]+\\s+[^.!?]+\\.\\s+[A-Z][a-z]+\\s+does\\s+not\\."
  - "\\b[A-Z][a-z]+\\s+[^.!?]+\\.\\s+[A-Z][a-z]+\\s+do\\s+not\\."

  # Multi-word-subject parallel-staccato:
  # "Concurrent readers don't block each other. One writer at a time
  # doesn't block readers."
  # Subjects up to 5 words; second sentence carries the verb pattern.
  # Matches both "doesn't"/"don't" and "does not"/"do not" forms.
  - "\\b[A-Z][a-z]+(?:\\s+[\\w-]+){1,4}\\s+[^.!?]+\\.\\s+[A-Z][a-z]+(?:\\s+[\\w-]+){1,4}\\s+(?:doesn'?t|don'?t|does\\s+not|do\\s+not)\\b[^.!?]*\\."

  # === Solo two-word staccato (enumerated verbs) ===
  # Single "Subject verb." sentences that AI drops for dramatic effect.
  # Only flagged for verbs commonly used this way.
  # scales/works/counts are dropped here: MicDrop owns the pronoun
  # one-liner ("It works.", "That scales.") and fires on them already.
  - "\\b[A-Z][a-z]+\\s+(?:ships?|breaks?|builds?|flows?|lands?|wins?|fails?|scans?|reads?|stays?|drops?|clicks?|runs?|falls?|grows?|fades?|leads?|hits?|fits?|stops?|starts?|moves?|waits?|holds?|lives?|dies?|rises?|shines?|shifts?|sticks?|stands?|spreads?|bends?|flips?|snaps?|locks?|fires?|loads?|calls?|pulls?|push(?:es)?|pays?|sells?|talks?|walks?)\\."
