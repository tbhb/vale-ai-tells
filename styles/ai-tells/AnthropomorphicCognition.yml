---
extends: existence
message: "AI anthropomorphism: '%s'. State what the tool checks or produces. Disable this rule for prose about people."
level: error
nonword: true
ignorecase: true
# Cognition and volition handed to an artifact: a spec "wants" a retry, a
# release "teaches" a skill to sweep, a dictionary "learns" a word, a parser
# "gets confused." An earlier audit left volition uncovered because no gate
# separated the AI usage from ordinary documentation style; the inverted
# gate the figurative family later adopted supplies one. The subject or
# object rides inside each span, so the exceptions can name the people who
# legitimately think, and what remains is the machine given a mind.
#
# Costs by token, measured across the Go and Python standard libraries. The
# wanting token leaves about a dozen matches once the exceptions apply
# ("the spec wants us to retry," "an algorithm wants the powers"), each the
# personification itself, so they fire by design. Teaching leaves three Go
# comments that teach the compiler or a tool, the figure again. Confusion
# leaves about a dozen tool-confusion comments plus two reader-directed
# warnings ("do not get confused by this"), the latter being the cost.
# Misbehaving leaves two finite uses; the participial "misbehaving client"
# stays uncovered as established vocabulary for an adversarial peer. Also
# left uncovered: "doesn't know," which both corpora use over thirty times
# ("the compiler doesn't know"), too saturated for any gate to rescue.
# Machine-learning prose, where a model literally learns, disables the rule.
#
# A documentation-corpus audit (2026-09) counted fifty personifications
# beyond that set and two frames the teaching token missed. The verbs that
# joined, each behind the determiner-gated subject so the exceptions can
# name a human actor, with their corpus costs: "decides" (23, "the
# compiler decides where symbols go," the figure itself), "asks for" and
# "asks the" (7, "the GC asks for some work"), "answers" (0), "can't
# tell," "can't prove," and their kin (6, "we can't guess" among them),
# "could mistake X for" (0), "guesses" (2), "adopts" (0), the bare
# "forbids" with a third-person subject (1, "RFC 7230 neither permits nor
# forbids"), "arbitrates" and "cedes" (0), "hunts" (0), "pretends" behind
# a pronoun subject (3), and transitive "confuse" (15, "confuse the
# external linker"), the positive form of the "gets confused" the rule
# already reads. "Tells you to" takes a lookahead-only span, because the
# pronoun it needs is on the exception list (6, "the poller tells us to
# stop"). Three stay out: bare "behave" (28, "how these sources of work
# behave" is how both corpora describe a component, with no complement to
# gate on), "objects" as a verb (its noun floods every gate), and
# "refuses," which is the plain verb this package itself recommends for
# a check that rejects its input.
#
# The teaching token puts the pupil inside its span so the exceptions can
# name a human one, which is right for "teach the compiler" and wrong for
# the ditransitive frame, where the artifact is the teacher and the human
# the pupil ("a codebook that drifted would teach a reviewer the wrong
# contract," "it teaches the reviewer a contract"). That frame takes a
# lookahead-only span listed ahead of the general token, so the alternation
# reads it first and the exceptions never see the pupil. One corpus hit,
# a Go comment "teaching the compiler that" a value is in range.
exceptions:
  # People and roles who legitimately want, learn, and get taught. The
  # bare pronouns carry their own boundaries because they are short enough
  # to hide inside ordinary words.
  - "(?i)\\bwe\\b"
  - "(?i)\\byou\\b"
  - "(?i)\\bi\\b"
  - "(?i)\\bthey\\b"
  - "(?i)\\bhe\\b"
  - "(?i)\\bshe\\b"
  - "(?i)\\bme\\b"
  - "(?i)\\bus\\b"
  - "(?i)\\bhim\\b"
  - "(?i)\\bher\\b"
  - "(?i)everyone"
  - "(?i)everybody"
  - "(?i)anyone"
  - "(?i)someone"
  - "(?i)nobody"
  - "(?i)users?"
  - "(?i)callers?"
  - "(?i)clients?"
  - "(?i)readers?"
  - "(?i)authors?"
  - "(?i)writers?"
  - "(?i)operators?"
  - "(?i)maintainers?"
  - "(?i)developers?"
  - "(?i)programmers?"
  - "(?i)contributors?"
  - "(?i)reviewers?"
  - "(?i)engineers?"
  - "(?i)students?"
  - "(?i)teachers?"
  - "(?i)child(?:ren)?"
  - "(?i)kids?"
  - "(?i)people"
  - "(?i)person"
  - "(?i)teams?"
  - "(?i)folks?"
  - "(?i)customers?"
  - "(?i)applications?"
  - "(?i)schools?"
  # A relative clause with "it" for a subject puts the wanter outside the
  # span ("the surface it wants" names a consumer's choice), so the token
  # says nothing about who wants.
  - "(?i)\\s+it\\s+want(?:s|ed)?\\b"
tokens:
  # --- Volition: a determiner-led artifact that wants ("the spec wants us
  # to retry," "a dependency bump wants merging," "the RFC wants a break").
  # An optional modifier word and an optional adverb sit inside the span.
  # The lookbehind drops the participle inversion, where a person does the
  # wanting ("somebody installing a binary wants an install line").
  - "(?<!ing\\s+)\\b(?:a|an|the|this|that|these|those|each|every|its|their)\\s+(?:[a-z]+\\s+)?[a-z]+\\s+(?:really\\s+|only\\s+|always\\s+|never\\s+|still\\s+|also\\s+|just\\s+|often\\s+|actually\\s+)?want(?:s|ed)?\\b"

  # --- Teaching, the ditransitive frame first: the artifact as teacher and
  # a person as pupil ("would teach a reviewer the wrong contract," "it
  # teaches the reviewer a contract"). The span is the verb alone, so the
  # human pupil never reaches the exceptions; prose about people disables
  # the rule.
  - "\\bt(?:each(?:es|ing)?|aught)(?=\\s+(?:the|a|an|its|this|that|every|each)\\s+(?:[a-z]+\\s+)?[a-z]+\\s+(?:a|an|the|its|this|that|which|what|how|to|about|nothing|something|everything|one)\\b)"

  # --- Teaching: a tool as the pupil ("teach the compiler that," "taught
  # that validator a new format," "teach Renovate to read the markers"). The
  # lookahead keeps the human idiom "taught in schools" out of the span,
  # and the object word stays inside it for the exceptions.
  - "\\bt(?:each(?:es|ing)?|aught)\\s+(?:the\\s+|a\\s+|an\\s+|its\\s+|this\\s+|that\\s+|every\\s+|each\\s+)?(?!in\\s+|at\\s+|by\\s+|about\\s+|over\\s+|during\\s+|through\\s+|for\\s+|with\\s+|from\\s+)[a-z][a-z-]*"
  - "\\b(?:can|could|must|has\\s+to|have\\s+to|had\\s+to)\\s+be\\s+taught\\b"

  # --- Learning: a tool as the student ("cspell learns the new slug"). The
  # third-person singular is the gate; "we learned the hard way" carries a
  # human subject the span never sees, so the past tense stays out.
  - "\\blearns\\s+(?:a|an|the|its|this|that|these|those)\\b"

  # --- Ignorance: a tool with a blind spot ("the manager knows nothing
  # about that format," "the hook has no idea the file moved").
  - "\\bknows?\\s+nothing\\s+(?:about|of)\\b"
  - "\\bha(?:s|ve|d)\\s+no\\s+idea\\b"

  # --- Inquiry and trust: a script that asks and a reviewer's tool that
  # believes ("detection asks whether any package holds it," "the reviewer
  # trusts the inlined material," "the projections a query asks for").
  # Trust-anchor and certificate prose uses the verb literally; security
  # writing disables the rule.
  - "\\basks\\s+whether\\b"
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no)\\s+(?:[a-z'-]+\\s+)?[a-z]+\\s+(?:then\\s+|also\\s+|never\\s+|still\\s+|only\\s+|always\\s+|often\\s+|rarely\\s+|actually\\s+)?asks?\\s+(?:for|the|a|an|its|this|that|whether|if|what|which|how|when|where|why|about|it|them|nothing|only)\\b"
  - "\\btrusts\\s+(?:the|its|a|an|this|that|whatever|inlined)\\b"

  # --- Judgment: the artifact as the one who decides, answers, forbids,
  # or arbitrates ("a record's bytes decide which extractor runs," "the
  # library decides for itself," "prose answers questions an exact match
  # can't," "determinism forbids a model on the decision path," "the band
  # the ensemble arbitrates," "a signal that cedes recall," "the create
  # arm adopts an open issue").
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no)\\s+(?:[a-z'-]+\\s+)?[a-z]+\\s+(?:then\\s+|also\\s+|never\\s+|still\\s+|only\\s+|always\\s+|itself\\s+|alone\\s+)?(?:decides?|decided|deciding)\\s+(?:which|whether|what|how|when|where|if|for\\s+itself|on|to|the|a|an|that|between|among)\\b"
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no)\\s+(?:[a-z'-]+\\s+)?[a-z]+\\s+(?:then\\s+|also\\s+|never\\s+|still\\s+|only\\s+|always\\s+)?answers\\s+(?:questions?|a|an|the|its|this|that|every|each|from|with|by)\\b"
  - "\\banswers?\\s+questions\\b"
  # The accountable artifact: "answers to" with a rule, a style, or a gate
  # as the authority ("the sentence-case rule that every other heading here
  # answers to," "a squash message answers to the same styles," "a draft
  # under tmp/ answers to nothing," "what a commit answers to"). The
  # lookahead refuses the noun sense, an answer to a question or a problem
  # ("the answers to these two questions," "finding answers to Go
  # questions"), the singular spelling keeps "an answer to the query" and
  # "have to answer to make progress" out, and the stranded token reads
  # the relative-clause tail. The verb matches nowhere across the seven
  # pre-LLM corpora (2026-09).
  - "\\b(?:(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no|which|what)\\s+(?:[a-z'-]+\\s+){0,2}[a-z]+|it|which|that|this|nothing|everything)\\s+(?:then\\s+|also\\s+|never\\s+|still\\s+|only\\s+|always\\s+)?answers\\s+to\\b(?!\\s+(?:(?:the\\s+|a\\s+|an\\s+|this\\s+|that\\s+|these\\s+|those\\s+|these\\s+two\\s+|those\\s+two\\s+|such\\s+|all\\s+|some\\s+|any\\s+|both\\s+|each\\s+|every\\s+|many\\s+|several\\s+|the\\s+same\\s+|those\\s+same\\s+|your\\s+|my\\s+|our\\s+|their\\s+|its\\s+|his\\s+|her\\s+|one\\s+|two\\s+|three\\s+|\\d+\\s+)?(?:[a-z'-]+\\s+)?(?:questions?|problems?|issues?|queries|requests?|riddles?|puzzles?|prompts?|objections?|concerns?|criticisms?)\\b|\\(|\\d|`))"
  - "\\banswers?\\s+to\\s+(?:nothing|nobody|no\\s+one|none)\\b"
  - "\\banswers?\\s+to(?=\\s*[.,;:!?]|$)"
  - "\\b(?!(?:we|i|you|they|he|she|who|which|that|it|this)\\b)[a-z-]+\\s+forbids\\b"
  - "\\barbitrat(?:es?|ed|ing)\\b"
  - "\\bced(?:es?|ed|ing)\\b"
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no)\\s+(?:[a-z'-]+\\s+)?[a-z]+\\s+(?:then\\s+|also\\s+|never\\s+|still\\s+|only\\s+|always\\s+|simply\\s+|just\\s+)?adopts?\\s+(?:a|an|the|its|this|that|these|those|every|each|any|no|whatever|what)\\b"

  # --- Instruction: the failure text as the one giving orders ("every
  # failure tells you to refresh it"). The span is the verb alone, since
  # "you" and "us" sit on the exception list above.
  - "\\btells?(?=\\s+(?:you|us)\\s+to\\b)"

  # --- Fallibility: the artifact that could mistake, guess, or fail to
  # tell ("a file the loader could mistake for a complete capture," "one
  # scan can't prove a record left for good," "the parser guesses the
  # encoding"). The exceptions keep a caller who can't tell the difference
  # out of it.
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no)\\s+(?:[a-z'-]+\\s+)?[a-z]+\\s+(?:could|might|may|would|can|will|should)\\s+(?:easily\\s+|then\\s+|also\\s+|still\\s+)?mistake\\s+(?:a|an|the|its|this|that|these|those|it|them|one|for)\\b"
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no)\\s+(?:[a-z'-]+\\s+)?[a-z]+\\s+(?:can't|cannot|can\\s+not|couldn't|could\\s+not|won't|will\\s+not)\\s+(?:then\\s+|also\\s+|still\\s+|yet\\s+|always\\s+|reliably\\s+|easily\\s+)?(?:tell|prove|distinguish|guess|judge|decide)\\b"
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no)\\s+(?:[a-z'-]+\\s+)?[a-z]+\\s+(?:then\\s+|also\\s+|never\\s+|still\\s+|only\\s+|always\\s+|simply\\s+|just\\s+)?guess(?:es|ing)\\b"

  # --- Pretense and pursuit ("rather than pretending the item never
  # existed," "it pretends the row is gone," "the secret scanner hunts
  # secrets"). "Pretends otherwise" and "pretending to be" stay in
  # AnthropomorphicJustification and FigurativeDisguises.
  - "\\b(?:rather\\s+than|instead\\s+of|without|while|by|before)\\s+pretending\\b"
  - "\\b(?:it|they|which|that|this)\\s+(?:then\\s+|also\\s+|just\\s+|simply\\s+|still\\s+)?pretends?\\b(?!\\s+(?:otherwise|not\\s+to|to\\s+be)\\b)"
  - "\\bhunt(?:s|ed)\\b"

  # --- Confusion and misconduct: the tool as a flustered or naughty actor
  # ("the parser gets confused," "if the release misbehaves," "characters
  # that only confuse tokenization," "would confuse the trace parser").
  - "\\b(?:gets?|got|getting)\\s+confused\\b"
  - "\\bconfus(?:es?|ed|ing)\\s+(?:the|a|an|its|this|that|every|each)\\s+(?:[a-z]+\\s+)?[a-z]+\\b"
  - "\\bconfus(?:es?|ing)\\s+(?:tokeni[sz]ation|parsing|matching|detection|scoring|ranking|indexing|rendering|resolution|lookup|dispatch)\\b"
  - "\\bmisbehav(?:es|ed)\\b"

  # --- Honesty: text or a tool credited with candor ("the refusal text was
  # telling the truth about what the task wanted").
  - "\\btell(?:s|ing)?\\s+the\\s+truth\\b"
  - "\\btold\\s+the\\s+truth\\b"
