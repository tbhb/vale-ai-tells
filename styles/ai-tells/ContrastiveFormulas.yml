  - "[A-Z][a-z]+\\s+doesn'?t\\s+mean\\s+[^.!?]+\\.\\s+[Ii]t\\s+means\\s+[^.!?]+"
  - "[A-Z][a-z]+\\s+does\\s+not\\s+mean\\s+[^.!?]+\\.\\s+[Ii]t\\s+means\\s+[^.!?]+"

  # === Multi-word subject "isn't X. It's Y." ===
  # Catches "The colophon isn't a disclaimer. It's a feature."
  # The single-word "[Noun] isn't X. It's Y." patterns above only match
  # single capitalized-word subjects.

  # "The [noun] isn't X. It's Y."
  - "[Tt]he\\s+[a-z]+\\s+isn'?t\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"
  - "[Tt]he\\s+[a-z]+\\s+is\\s+not\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"
  - "[Tt]he\\s+[a-z]+\\s+isn'?t\\s+[^.!?]+\\.\\s+[Ii]t\\s+is\\s+[^.!?]+"

  # "A/An [noun] isn't X. It's Y."
  - "[Aa]n?\\s+[a-z]+\\s+isn'?t\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"
  - "[Aa]n?\\s+[a-z]+\\s+is\\s+not\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"

  # "Our/Your/Their [noun] isn't X. It's Y."
  - "(?:Our|Your|Their|Its)\\s+[a-z]+\\s+isn'?t\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"
  - "(?:Our|Your|Their|Its)\\s+[a-z]+\\s+is\\s+not\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"

  # Multi-word/acronym subjects — catch-all with "isn't...It's" anchor
  # "WCAG 2.1 AA isn't a checkbox. It's a constraint."
  - "[^.!?]+\\s+isn'?t\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"
  - "[^.!?]+\\s+is\\s+not\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"
