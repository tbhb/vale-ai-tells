  - "[A-Z][a-z]+\\s+is\\s+not\\s+[^.!?]+\\.\\s+[Ii]t'?s\\s+[^.!?]+"

  # "a Y, not a Z" bare appositive: the categorical assertion with
  # preemptive correction, verb optional ("a refinement, not a rivalry").
