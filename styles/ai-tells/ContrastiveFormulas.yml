  - "[A-Z][a-z]+\\s+are\\s+[^,]+,\\s+not\\s+[^.]+"

  # "Not only X but also Y" patterns
  - "[Nn]ot\\s+only\\s+[^,;—:]+,?\\s+but\\s+(?:also\\s+)?[^.!?]+"

  # "Not because X, but because Y" causal variant
  - "[Nn]ot\\s+because\\s+[^,;—:]+,?\\s+but\\s+because\\s+[^.!?]+"

  # === Plural subject negation-correction ===

