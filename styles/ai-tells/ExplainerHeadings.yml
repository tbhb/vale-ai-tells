---
extends: existence
message: "AI explainer heading: '%s'. State the topic instead."
level: error
ignorecase: true
scope: heading
tokens:
  # The general free-relative heading: a wh-word, a determiner, then a
  # subject and its verb ("Why the Pin Exists," "How the Cache Works,"
  # "What the Data Shows"). The determiner gate keeps the conventional
  # doc heading out ("How to Configure X," "What's New"), and the two
  # required words after it hold the pattern to subject + verb. A section
  # that genuinely poses a question fires too ("When the Interpreter
  # Starts"); rename it to the topic ("Interpreter startup").
  - "(?:what|why|how|when|where|who)\\s+(?:the|this|that|these|those|a|an|each|every|your|our|its)\\s+[-'\\w]+\\s+[-'\\w]+"
  - Deep\s+Dive
  - Under\s+the\s+Hood
  - Demystifying
  - Why\s+It\s+Matters
  - Why\s+This\s+Matters
  - Why\s+It\s+Exists
  - Why\s+This\s+Exists
  - What\s+It\s+Solves
  - What\s+This\s+Solves
  - What\s+It\s+Does
  - What\s+This\s+Does
  - A\s+Closer\s+Look
  - The\s+Inner\s+Workings
