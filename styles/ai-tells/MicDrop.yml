---
extends: existence
message: "AI mic-drop: '%s'. Integrate the point into the surrounding text or cut it."
level: error
nonword: true
tokens:
  # ==========================================================================
  # Staccato declarations: short punchy sentences AI drops in for dramatic
  # effect. "All four are thin." "It matters." "And it shows."
  #
  # These read like someone slamming a gavel in what should be a calm
  # technical discussion. Human technical writers state facts inline;
  # AI punctuates with mic-drops.
  # ==========================================================================

  # ---- Pronoun + intransitive verb mic-drops ----
  # "It matters." "This works." "That scales."
  - "\\b(?:It|This|That)\\s+matters\\."
  - "\\b(?:It|This|That)\\s+works\\."
  - "\\b(?:It|This|That)\\s+shows\\."
  - "\\b(?:It|This|That)\\s+helps\\."
  - "\\b(?:It|This|That)\\s+scales\\."
  - "\\b(?:It|This|That)\\s+compounds\\."
  - "\\b(?:It|This|That)\\s+counts\\."
  - "\\b(?:It|This|That)\\s+adds\\s+up\\."
  - "\\b(?:It|This|That)\\s+pays\\s+off\\."
  - "\\b(?:It|This|That)\\s+depends\\."

  # ---- Explicit-NP subject + intransitive mic-drop verb ----
  # Same family as the pronoun set above, but with definite or demonstrative
  # noun-phrase subjects instead of bare pronouns. AI punctuates technical
  # discussion with these terminal one-liners.
  # "The unset-versus-bogus distinction matters." "The trust compounds."
  # [\w-] catches hyphenated subjects ("load-bearing", "user-facing").
  - "\\b(?:The|This|That)\\s+[\\w-]+(?:\\s+[\\w-]+){0,2}\\s+(?:matters|compounds|pays\\s+off|adds\\s+up)\\."

  # Plural form: "These details matter." "Those choices add up."
  - "\\b(?:These|Those)\\s+[\\w-]+(?:\\s+[\\w-]+){0,2}\\s+(?:matter|compound|pay\\s+off|add\\s+up)\\."

  # ---- "This/That/It + copula + adjective" emphatic declarations ----
  # "This is key." "That's intentional." "It was deliberate."
  - "\\b(?:It|This|That)(?:'s|\\s+is|\\s+was)\\s+(?:key|crucial|critical|intentional|deliberate|powerful|elegant|subtle|clean|simple|clear|important|significant|telling|striking|notable|profound|revealing|transformative|remarkable|essential|fundamental|beautiful|paramount|vital|obvious|neat|real|enough)\\."
  - "\\b(?:It|This|That)(?:'s|\\s+is|\\s+was)\\s+(?:by\\s+design|on\\s+purpose|no\\s+accident|no\\s+coincidence|not\\s+optional)\\."

  # ---- "They/These/Those + copula + adjective" ----
  # "These are thin." "Those were deliberate."
  - "\\b(?:They|These|Those)(?:'re|\\s+are|\\s+were)\\s+(?:thin|key|crucial|critical|intentional|deliberate|powerful|elegant|subtle|clean|simple|clear|important|significant|telling|striking|notable|profound|essential|vital|obvious|neat|enough)\\."

  # ---- "The [noun] is [adjective]." short dramatic assessments ----
  # "The result is clean." "The difference is subtle."
  - "\\bThe\\s+\\w+\\s+(?:is|are|was|were)\\s+(?:thin|clean|simple|subtle|clear|key|crucial|critical|intentional|deliberate|powerful|elegant|important|significant|telling|striking|notable|straightforward|profound|revealing|transformative|remarkable|essential|fundamental|beautiful|obvious|neat|real|paramount|vital)\\."
  - "\\bThe\\s+\\w+\\s+\\w+\\s+(?:is|are|was|were)\\s+(?:thin|clean|simple|subtle|clear|key|crucial|critical|intentional|deliberate|powerful|elegant|important|significant|telling|striking|notable|straightforward|profound|revealing|transformative|remarkable|essential|fundamental|beautiful|obvious|neat|real|paramount|vital)\\."

  # ---- Quantifier/determiner + copula + adjective mic-drops ----
  # Short declarations with a quantifier subject and a single-adjective verdict.

  # "All [noun] are [adjective]." — "All four are thin." "All three are identical."
  - "\\bAll\\s+\\w+\\s+(?:are|were)\\s+(?:thin|clean|simple|subtle|clear|key|crucial|critical|intentional|deliberate|powerful|elegant|important|significant|telling|striking|notable|straightforward|profound|essential|obvious|neat|identical|interchangeable|equivalent)\\."

  # "Both [are/noun are] [adjective]." — "Both are thin." "Both layers are thin."
  - "\\bBoth\\s+(?:are|were)\\s+(?:thin|clean|simple|subtle|clear|key|crucial|critical|intentional|deliberate|powerful|elegant|important|significant|telling|notable|straightforward|essential|obvious|identical|interchangeable|equivalent)\\."
  - "\\bBoth\\s+\\w+\\s+(?:are|were)\\s+(?:thin|clean|simple|subtle|clear|key|crucial|critical|intentional|deliberate|powerful|elegant|important|significant|telling|notable|straightforward|essential|obvious|identical|interchangeable|equivalent)\\."

  # "Each/Every [noun] is [adjective]." — "Each handler is clean." "Every choice is deliberate."
  - "\\b(?:Each|Every)\\s+\\w+\\s+(?:is|was)\\s+(?:thin|clean|simple|subtle|clear|key|crucial|critical|intentional|deliberate|powerful|elegant|important|significant|telling|striking|notable|straightforward|profound|essential|obvious|neat|identical|independent|self-contained)\\."
  # "Each is [adjective]." — standalone without noun
  - "\\bEach\\s+(?:(?:one\\s+)?(?:is|was))\\s+(?:thin|clean|simple|subtle|clear|key|crucial|critical|intentional|deliberate|powerful|elegant|important|significant|telling|notable|straightforward|essential|obvious|identical|independent|self-contained)\\."

  # "Everything/Nothing is [adjective]." — "Everything is intentional." "Nothing is accidental."
  - "\\bEverything\\s+(?:is|was)\\s+(?:intentional|deliberate|purposeful|connected|composable|explicit|visible|traceable|testable|optional)\\."
  - "\\bNothing\\s+(?:is|was)\\s+(?:accidental|random|hidden|implicit|optional|wasted|redundant|superfluous|arbitrary|magical|surprising)\\."

  # "None are [adjective]." — "None are optional." "None are accidental."
  - "\\bNone\\s+(?:are|were|is|was)\\s+(?:optional|accidental|random|redundant|superfluous|arbitrary|wasted|surprising|hidden|magical)\\."

  # ---- Antithetical balance: "X changes, Y stays the same." ----
  # Two balanced clauses with change/permanence verb opposition, creating
  # a pithy aphorism. AI reaches for this structure constantly.
  # "The adapter changes, the service call stays the same."
  # "Tools change, principles don't."
  # "Frameworks come and go, fundamentals remain."

  # Change-verb, then stay-verb (comma / semicolon / em-dash separated)
  - "\\b(?:changes?|evolves?|shifts?|varies|vary|comes?\\s+and\\s+go(?:es)?)[,;—]\\s+(?:the\\s+|a\\s+|an\\s+)?(?:\\w+\\s+){0,4}(?:stays?\\s+the\\s+same|remains?(?:\\s+the\\s+same)?|holds?|persists?|endures?|(?:doesn't|don't)\\s+change)\\."

  # Stay-verb, then change-verb (reverse order)
  - "\\b(?:stays?\\s+the\\s+same|remains?(?:\\s+the\\s+same)?|holds?|persists?|endures?)[,;—]\\s+(?:the\\s+|a\\s+|an\\s+)?(?:\\w+\\s+){0,4}(?:changes?|evolves?|shifts?|varies|vary|comes?\\s+and\\s+go(?:es)?)\\."

  # Period-separated: "Tools change. Principles don't."
  - "\\b(?:changes?|evolves?|shifts?|varies|vary)\\.\\s+[A-Z](?:\\w+\\s+){0,3}(?:stays?\\s+the\\s+same|remains?|holds?|persists?|endures?|(?:doesn't|don't)\\s+change)\\."
  - "\\b(?:stays?\\s+the\\s+same|remains?|holds?|persists?|endures?)\\.\\s+[A-Z](?:\\w+\\s+){0,3}(?:changes?|evolves?|shifts?|varies|vary)\\."

  # ---- Verbless fragment mic-drops ----
  # Short sentences with no main verb, used as paragraph closers.
  # Distinct from the copula patterns above — these have no verb at all.

  # Bare adjective list fragments: "Simple, predictable, testable."
  - "\\b(?:Pure|Clean|Simple|Clear|Fast|Small|Thin|Lean|Cheap|Safe|Flat|Sane|Strict|Minimal|Explicit|Composable|Predictable|Testable|Readable|Maintainable|Reproducible|Intentional|Deliberate|Declarative|Idiomatic|Immutable|Ergonomic|Deterministic|Straightforward|Opinionated),\\s+(?:\\w+,\\s+)*(?:and\\s+)?\\w+\\."

  # Parallel noun-phrase fragment pairs: "Clean separation, clear ownership."
  - "\\b(?:Clean|Clear|Pure|Simple|Single|One|Zero|Full|Same|Thin|Flat|Strict|Minimal|Explicit|Complete|Total|Direct|Separate)\\s+\\w+,\\s+(?:clean|clear|pure|simple|single|one|zero|full|same|thin|flat|strict|minimal|explicit|complete|total|direct|separate|different|no|fewer?)\\s+\\w+\\."

  # Comparative-adjective balanced fragments:
  # "Stronger isolation, more lifecycle machinery."
  # "Faster delivery, fewer surprises."
  # Comparative adjective + 1-2 word noun, paired with another
  # comparative + noun. The balanced tradeoff aphorism pattern.
  - "\\b(?:Stronger|Weaker|Faster|Slower|Better|Worse|Cleaner|Simpler|Smaller|Larger|Bigger|Higher|Lower|Tighter|Looser|Smoother|Newer|Older|Richer|Leaner|Safer|Saner|More|Less|Fewer)\\s+[\\w-]+(?:\\s+[\\w-]+)?,\\s+(?:stronger|weaker|faster|slower|better|worse|cleaner|simpler|smaller|larger|bigger|higher|lower|tighter|looser|smoother|newer|older|richer|leaner|safer|saner|more|less|fewer)\\s+[\\w-]+(?:\\s+[\\w-]+)?\\."

  # "Just/Pure/Clean + noun" standalone fragments: "Pure orchestration." "Just data."
  - "\\b(?:Just|Pure|Clean|Plain|Bare|Raw|Straight|Strict|Simple|Mere)\\s+\\w+\\."

  # "Just X, nothing more/else" closers: "Just data, nothing more."
  - "\\bJust\\s+\\w+,\\s+nothing\\s+(?:more|else|fancy|special|clever)\\."

  # Fragment + dramatic qualifier spliced with "and":
  # "Pure orchestration, and the one package that imports from all layers."
  - "\\b(?:Pure|Clean|Just|Simple|Plain|Bare|Raw|Mere|Thin|Flat)\\s+\\w+,\\s+and\\s+[^.]+\\."

  # Terse prepositional callback: "With PostgreSQL, one."
  # A telegraphic fragment that only makes sense as a parallel to the
  # preceding sentence. The single-word answer is the mic-drop.
  - "\\bWith\\s+\\w+(?:[ -]\\w+)?,\\s+\\w+\\."

  # ---- Dramatic codas: "And [short clause]." ----
  # "And it shows." "And that's okay." "And that's the point." is
  # PointVerdict's.
  - "\\bAnd\\s+it\\s+shows\\."
  - "\\bAnd\\s+it\\s+works\\."
  - "\\bAnd\\s+it\\s+matters\\."
  - "\\bAnd\\s+it\\s+helps\\."
  - "\\bAnd\\s+it\\s+scales\\."
  - "\\bAnd\\s+that'?s\\s+okay\\."
  - "\\bAnd\\s+that'?s\\s+fine\\."
  - "\\bAnd\\s+that'?s\\s+enough\\."
  - "\\bAnd\\s+that'?s\\s+it\\."

  # ---- "Full stop" / "Period" as emphasis ----
  # Standalone one-word emphatic "Period." only; anchored to a sentence
  # boundary so the ordinary noun ("billing period.", "grace period.")
  # stays clean. Capitalized form only — the lowercase noun is the FP.
  - "\\bFull\\s+stop\\."
  - "(?:^|[.!?\"]\\s+)Period\\."

  # ---- Contrastive fragment mic-drops ----
  # "X, not Y." — contrastive fragment with no verb
  # "Dense, not cramped." "Fast, not sloppy." "Opinionated, not rigid."
  - "\\b[A-Z][a-z]+,\\s+not\\s+[a-z]+\\."
  - "\\b[A-Z][a-z]+,\\s+never\\s+[a-z]+\\."

  # Bare "Not X." / "No X." standalone fragment: "Not now."
  # "No singleton." AI deploys these as one-word verdicts — a tiny
  # period-bound answer to a question the surrounding prose never
  # asked. The broader regex catches both negation forms
  # with any single-word tail. Some conversational fragments
  # ("No idea.", "No way.", "Not bad.") fire too; acceptable for
  # an error-level rule in technical-doc contexts.
  - "\\bNot?\\s+\\w+\\."

  # Verb-led contrastive: the extended-sentence remediation cheat
  # that appears after the bare-fragment form above gets flagged.
  # "Isolation here stays logical, not physical."
  # "The output reads clean, not cluttered."
  # "Code becomes declarative, not imperative."
  # Subject is 1-3 words; the linking-ish verb list mirrors the
  # copula sense ("X stays/remains/becomes Y" = "X is Y").
  - "\\b[A-Z][a-z]+(?:\\s+\\w+){0,2}\\s+(?:stays?|remains?|becomes?|feels?|reads?|seems?|sounds?|looks?|appears?|grows?|ends?\\s+up|comes?\\s+across)\\s+[a-z-]+,\\s+not\\s+[a-z-]+\\."
  - "\\b[A-Z][a-z]+(?:\\s+\\w+){0,2}\\s+(?:stays?|remains?|becomes?|feels?|reads?|seems?|sounds?|looks?|appears?|grows?|ends?\\s+up|comes?\\s+across)\\s+[a-z-]+,\\s+never\\s+[a-z-]+\\."

  # Verb-led contrastive with non-linking verbs + noun objects:
  # "They share a contract, not code."
  # "Custom signals belong in stderr text, not in the exit number."
  # Different construction from the linking-verb family above — the object
  # is a noun phrase rather than an adjective.
  - "\\b[A-Z][a-z]+(?:\\s+\\w+){0,2}\\s+(?:shares?|keeps?|holds?|lives?|belongs?|sits?|points?|goes|go|gives?|takes?)\\s+(?:(?:in|on|to|at|with|for)\\s+)?[\\w-]+(?:\\s+[\\w-]+){0,3},\\s+not\\s+(?:(?:in|on|to|at|with|for)\\s+)?[\\w-]+(?:\\s+[\\w-]+){0,3}[.:]"

  # "X over Y." — preference fragment
  # "Clarity over cleverness." "Depth over breadth."
  - "\\b[A-Z][a-z]+\\s+over\\s+[a-z]+\\."

  # Comparative aphorism: "X verbs comparative-adjective than Y."
  # "Disk costs less than lost context."
  # "Tests run faster than docs."
  # Concise, sentence-final, AI tutorial-blog tone.
  - "\\b[A-Z][a-z]+(?:\\s+\\w+){0,2}\\s+\\w+s\\s+(?:more|less|fewer|faster|slower|cheaper|cleaner|simpler|safer|tighter|better|worse|larger|smaller|bigger|higher|lower|longer|shorter)\\s+than\\s+[^.!?]+\\."

  # "X, not Y, not Z." — extended contrastive
  - "\\b[A-Z][a-z]+,\\s+not\\s+[a-z]+,\\s+not\\s+[a-z]+\\."

  # "X, then Y." — sequencing fragment
  # "Scannable, then readable." "Simple, then fast."
  - "\\b[A-Z][a-z]+,\\s+then\\s+[a-z]+\\."

  # "X first, Y second." — priority fragment
  - "\\b[A-Z][a-z]+\\s+first,\\s+[a-z]+\\s+second\\."
  - "\\b[A-Z][a-z]+\\s+first,\\s+[a-z]+\\s+never\\."

  # "Verb in the noun." — imperative mic-drop
  # "Invest in the system." "Trust the process." "Ship the thing."
  - "\\b(?:Invest|Trust|Embrace|Ship|Build|Start|Keep|Focus|Lean|Bet|Play|Own|Do)\\s+(?:in\\s+|on\\s+|into\\s+)?the\\s+[a-z]+\\."

  # "[Noun] is a [noun]." — categorical declaration as closer
  # "Density is a feature." "Complexity is a choice."
  - "\\b[A-Z][a-z]+\\s+is\\s+an?\\s+[a-z]+\\."

  # "the X, not the Y" — tagline gloss after a colon
  # "Implicit positioning: the reference shelf, not the opinion column."
  - ":\\s+the\\s+[^,]+,\\s+not\\s+the\\s+[^.]+"
