  - "\\b[Tt]hat\\s+might\\s+sound\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "Admittedly/Granted" openers
  - "\\bAdmittedly,\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\bGranted,\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "To be fair" pattern
  - "\\bTo\\s+be\\s+fair,\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\bTo\\s+be\\s+honest,\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "While this might/may appear" pattern
  - "\\bWhile\\s+this\\s+might\\s+appear\\s+[^,]+,\\s+[^.!?]+"
  - "\\bWhile\\s+this\\s+may\\s+appear\\s+[^,]+,\\s+[^.!?]+"
  - "\\bWhile\\s+it\\s+might\\s+appear\\s+[^,]+,\\s+[^.!?]+"
  - "\\bWhile\\s+it\\s+may\\s+appear\\s+[^,]+,\\s+[^.!?]+"

  # "Not meant to be X, but..." pattern
  - "\\b[Tt]his\\s+isn'?t\\s+meant\\s+to\\s+be\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\b[Ii]t'?s\\s+not\\s+meant\\s+to\\s+be\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "On the surface X, but..." pattern
  - "\\bOn\\s+the\\s+surface,\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\bOn\\s+the\\s+surface\\s+this\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "At first glance" pattern
  - "\\bAt\\s+first\\s+glance,\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\bAt\\s+first\\s+glance\\s+this\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "I know this seems/sounds" pattern
  - "\\bI\\s+know\\s+this\\s+seems\\s+[^,]+,\\s+but\\s+[^.!?]+"
