  - "\\bI\\s+know\\s+it\\s+sounds\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "While X, Y" hedged openers (preemptive concession)
  - "\\bWhile\\s+[^,]+\\s+can\\s+[^,]+,\\s+[^.!?]+"
  - "\\bWhile\\s+[^,]+\\s+is\\s+[^,]+,\\s+[^.!?]+"
