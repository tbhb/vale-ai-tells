---
extends: existence
message: "AI defensive hedge: '%s'. State your point directly without pre-defending it."
level: error
nonword: true
tokens:
  # "This is more of X than Y, but..." pattern
  - "\\b[Tt]his\\s+is\\s+more\\s+of\\s+[^,]+\\s+than\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\b[Ii]t'?s\\s+more\\s+of\\s+[^,]+\\s+than\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "Not the most X, but..." pattern
  - "\\b[Ii]t'?s\\s+not\\s+the\\s+most\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\b[Tt]his\\s+isn'?t\\s+the\\s+most\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "May seem/might seem X, but..." pattern
  - "\\b[Tt]his\\s+may\\s+seem\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\b[Tt]his\\s+might\\s+seem\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\b[Ii]t\\s+may\\s+seem\\s+[^,]+,\\s+but\\s+[^.!?]+"
  - "\\b[Ii]t\\s+might\\s+seem\\s+[^,]+,\\s+but\\s+[^.!?]+"

  # "Might sound X, but..." pattern
  - "\\b[Tt]his\\s+might\\s+sound\\s+[^,]+,\\s+but\\s+[^.!?]+"
