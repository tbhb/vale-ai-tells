---
extends: existence
message: "AI overused verb: '%s'. Use the literal relation: is at or rests with. Disable this rule for furniture or geography prose."
level: error
nonword: true
ignorecase: true
# "Sits" is an AI fingerprint for placing an abstraction: an idea "sits at the
# intersection of" two fields, a tension "sits at the core of" a debate, the
# responsibility "sits with" a team, and unfinished work just "sits" idle. The
# sibling of FigurativeLands, but the calculus flips: literal sitting is
# everywhere (people, pets, furniture, buildings all sit), so a broad
# subject + "sits" + preposition rule would flood. The complement after the
# verb is the discriminator instead — each token curates a figurative sense, so
# "the cat sits on the mat" stays quiet. Domain writing where these placements
# are literal (furniture, cartography, page layout) disables the whole rule.
# "At the heart of" is left to PromotionalPuffery to avoid a double flag.
tokens:
  # --- Conceptual-location placement: an abstraction is located at a figurative
  # point ("sits at the intersection of," "sits at the core of"). The scaffold
  # noun is the tell, so the subject need not be curated.
  - "\\bsit(?:s|ting)?\\s+(?:squarely\\s+|firmly\\s+|neatly\\s+|cleanly\\s+|comfortably\\s+|uncomfortably\\s+|uneasily\\s+|awkwardly\\s+|snugly\\s+)?at\\s+the\\s+(?:intersection|center|centre|core|nexus|crux|crossroads|confluence|junction|foundation|edge|apex|boundary)\\s+of\\b"

  # --- Range placement: a value or answer located along an implied spectrum
  # ("sits somewhere between," "sits somewhere in the middle").
  - "\\bsit(?:s|ting)?\\s+somewhere\\s+(?:between|in|along|on|near|toward|around|beyond)\\b"

  # --- Adverb + relational preposition. The figurative adverb marks the
  # placement as conceptual ("sits squarely within scope," "sits comfortably
  # alongside," "sits uneasily with"), which a literal object rarely does.
  - "\\bsit(?:s|ting)?\\s+(?:squarely|firmly|neatly|cleanly|comfortably|uncomfortably|uneasily|awkwardly|snugly|precariously)\\s+(?:within|inside|in|at|on|alongside|atop|above|below|beneath|beside|between|with|next|among|amid|outside)\\b"

  # --- Companion or stacked placement. "Alongside," "atop," and "astride" read
  # as figurative pairing, ranking, or straddling ("sits alongside the
  # incumbent," "sits atop the leaderboard," "sits astride two domains").
  # Literal senses (a fork alongside a plate) disable the rule for furniture
  # prose.
  - "\\bsit(?:s|ting)?\\s+(?:alongside|atop|astride)\\b"

  # --- Rests-with and within-scope: responsibility or membership assigned by
  # placement ("the decision sits with the board," "this sits within our
  # remit"). "Sit with it" for reflection rides along on purpose.
  - "\\bsit(?:s|ting)?\\s+with\\b"
  - "\\bsit(?:s|ting)?\\s+(?:squarely\\s+|firmly\\s+|neatly\\s+|comfortably\\s+)?within\\b"

  # --- Dormancy: work left unaddressed just "sits" ("the ticket sits idle,"
  # "the feature sits in isolation," "the draft just sits there").
  - "\\bjust\\s+sit(?:s|ting)?\\s+there\\b"
  - "\\bsit(?:s|ting)?\\s+in\\s+isolation\\b"
  - "\\bsit(?:s|ting)?\\s+(?:idle|unused|untouched|unresolved|unaddressed|unfinished|dormant|neglected|stale|forgotten|abandoned)\\b"

  # --- Acceptance idiom: an idea that "doesn't sit right" or "sits well." A
  # literal "sit still" is not in the set, so it stays quiet.
  - "\\bsit(?:s|ting)?\\s+(?:right|well|poorly|badly|wrong)\\b"

  # --- Emotional weight: news or a verdict that "sits heavy."
  - "\\bsit(?:s|ting)?\\s+(?:heavy|heavily)\\b"

  # --- Opposition placement ("sits at odds with," "sits in tension with").
  - "\\bsit(?:s|ting)?\\s+(?:at\\s+odds|in\\s+tension|in\\s+conflict|in\\s+opposition)\\s+(?:with|to)\\b"

  # --- Limbo: work stranded in an abstract holding place ("sits in limbo").
  - "\\bsit(?:s|ting)?\\s+in\\s+(?:limbo|purgatory|a\\s+holding\\s+pattern|the\\s+balance|a\\s+gr[ae]y\\s+area|no\\s+man's\\s+land)\\b"

  # --- Emphasis and indecision idioms ("sits front and center," "sits on the
  # fence").
  - "\\bsit(?:s|ting)?\\s+front\\s+and\\s+cent(?:er|re)\\b"
  - "\\bsit(?:s|ting)?\\s+on\\s+the\\s+fence\\b"

  # --- Layer-stack placement, gated on a structure noun so a literal "the shelf
  # sits above the sink" stays quiet ("the cache sits above the database tier").
  - "\\bsit(?:s|ting)?\\s+(?:just\\s+|right\\s+|directly\\s+)?(?:above|below|beneath|underneath|on\\s+top\\s+of)\\s+the\\s+(?:\\w+\\s+)?(?:layer|stack|tier|level|hierarchy|pipeline|chain)\\b"

  # --- Ranking placement, gated on a priority noun ("sits at the top of the
  # backlog"). Bare "atop" is already covered by the companion arm above.
  - "\\bsit(?:s|ting)?\\s+at\\s+the\\s+top\\s+of\\s+the\\s+(?:agenda|priority|priorities|to-?do|backlog|pile|queue)\\b"

  # --- Abstract-subject placement: a documentation or configuration element
  # located by "sits" where "is" would do ("the entry sits in the config
  # block," "the word changelog sat in the proper-noun list," "the flag sits
  # under the lint section"). It inverts the discriminator every other
  # token above uses. The complement here is a bare preposition that proves
  # nothing on its own, so the curated subject carries the whole burden, and
  # the set admits only nouns that name a part of a document, a config, or a
  # ruleset. Physical subjects stay quiet because they are not in the set:
  # "the cat sits on the mat," "our server rack sits behind the second door,"
  # and "a cabin sits on the ridge" never reach the verb.
  #
  # The known false positive is systems prose giving these same nouns their
  # storage-layout senses, where the placement is literal and measured: "the
  # word sits one slot above the frame pointer," "the field sits at offset
  # 8," "the value sits in a callee-saved register," "the block sits above
  # the heap." Runtime, compiler, and memory-layout writing disables the rule.
  # The past-tense "sat" appears only here; the complement-gated tokens
  # above match "sits" and "sitting" alone.
  - "\\b(?:the|this|that|each|every|a|an)\\s+(?:\\w+\\s+)?(?:entry|word|rule|flag|setting|option|field|block|section|clause|token|value|default|exemption|convention|definition|pattern)\\s+(?:\\w+\\s+)?(?:sits|sat|sitting)\\s+(?:in|on|at|above|below|under|beneath|within|inside|between|near|beside|alongside|behind)\\b"

  # --- The same placement with the subject left open. The curated token
  # above proved too narrow against a corpus of rejected commit messages,
  # which produced "the rules sit in the config" and "a figurative sat in
  # this message" — a plural subject and one outside the set, both missed.
  # A bare word in the subject slot measured at zero matches across the Go
  # and Python standard libraries, so the determiner and the preposition
  # carry the discriminator between them.
  #
  # What this does catch is literal sitting with an animate or physical
  # subject, which is the cost the rule already accepts at the top of the
  # file: prose about furniture, landscape, or page layout disables it
  # rather than the tokens contorting to admit a cat on a mat. A
  # documentation-corpus audit (2026-09) found "an orphan row sits on a
  # record" escaping on the modifier alone, so the subject slot now admits
  # one, and the preposition set covers the placements agent prose uses
  # ("sits ahead of," "sits outside every fence"); the extra reach adds
  # three corpus hits, one of them a sail. The curated token stays because
  # it admits a modifier between the subject and the verb as well.
  - "\\b(?:a|an|the|this|that|these|those|its|their|both|all)\\s+\\w+\\s+(?:\\w+\\s+)?(?:sits?|sat)\\s+(?:in|on|at|with|beside|under|behind|ahead\\s+of|outside|inside|beyond|among|across|atop|over|above|below|beneath|near|alongside|next\\s+to)\\b"

  # --- Pronoun and quantifier subjects, the same placement with the
  # noun carried over from the previous sentence ("these sit ahead of the
  # subcommand name," "the rest sit up to date," "it sits between the two
  # stages"). Four corpus hits, each the figure ("it sits on the
  # quarantine list").
  - "\\b(?:the\\s+rest|the\\s+others|these|those|they|it|both|all|most|some|each|several|which)\\s+(?:[a-z]+\\s+)?sits?\\s+(?:up\\s+to\\s+date|idle|empty|unused|quoted|escaped|in|on|at|with|beside|under|behind|ahead\\s+of|outside|inside|beyond|among|across|atop|over|above|below|beneath|near|alongside|next\\s+to)\\b"

  # --- Inverted word order, the preposition first and the subject after
  # the verb ("over each column sits an index," "beside it sit flat
  # columns"). Nothing subject-anchored can see this construction; anchoring on
  # the verb and a following determiner does. Measured at zero across both
  # standard libraries.
  - "\\b(?:over|beside|below|above|beneath|under|behind|alongside|inside|atop|before|after|ahead\\s+of|next\\s+to|between|around|across|outside|within|upon|on|in|at)\\s+(?:it|them|each|every|the|a|an|this|that|these|those|its|their)(?:\\s+[a-z]+){0,2}\\s+sits?\\s+(?:a|an|the|its|their|one|two|three|no|every|each|another|flat|[a-z]+s)\\b"

  # --- The state complement that describes a stored value by posture ("a
  # value sits quoted and escaped in the raw bytes," "the rest sit up to
  # date"). Three corpus hits, all the byte-layout sense the rule already
  # disables for ("a byte sits between the file data and the header").
  - "\\bsits?\\s+(?:quoted|escaped|up\\s+to\\s+date|ahead\\s+of|outside|beyond|among|across)\\b"
