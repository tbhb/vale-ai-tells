---
extends: existence
message: "AI arrival metaphor: '%s'. Say which step handles it, or where it is sent. Disable this rule for transit or physics prose."
level: error
nonword: true
ignorecase: true
# The bare arrival verb: an inanimate subject that "reaches" an object
# ("only referenced records reach the store," "an orphan never reaches an
# extractor," "the stage hasn't reached that record yet," "a fragment
# reaches nothing there"). FigurativeReaches takes the selection sense
# ("reaches for") and leaves arrival alone, which is where a
# documentation-corpus audit (2026-09) found 180 occurrences with no rule
# reading them. The plain sentence names the step that handles the record
# or the place it is sent. Like BareHolds, this is a separate rule so the
# selection tokens keep their zero corpus cost while this one carries its
# own.
#
# The subject slot is open behind a determiner, with a bare plural, the
# perfect-tense tokens, and the clause-final relative clause ("the items a
# query reaches") as companions, and the exceptions name what literally
# arrives: beings and limbs, vehicles, and the physics register where
# light, sound, and a river reach somewhere. The object lookahead refuses
# the numeric and terminal senses that are measurement rather than
# metaphor ("reaches zero," "reaches EOF," "reaches the end," "reaches its
# limit"), so a counter that reaches a threshold stays quiet, and it
# refuses the copulas and prepositions that would make the noun "reach"
# match ("its primary reach is"), which FigurativeNouns reads instead.
#
# What matches is the transport idiom of runtime prose, about fifty times
# across the Go and Python standard libraries ("so that it reaches the
# dist process," "the only backslashes that reach here," "if the forked
# child reaches its exec call"), each the figure and each flagged on the
# maintainer's call. Prose about network transit or physical travel
# disables the rule.
exceptions:
  # Body parts that do the literal reaching
  - "(?i)hands?"
  - "(?i)arms?"
  - "(?i)fingers?"
  # People and creatures
  - "(?i)people"
  - "(?i)person"
  - "(?i)m[ae]n"
  - "(?i)wom[ae]n"
  - "(?i)child(?:ren)?"
  - "(?i)kids?"
  - "(?i)bab(?:y|ies)"
  - "(?i)toddlers?"
  - "(?i)patients?"
  - "(?i)players?"
  - "(?i)climbers?"
  - "(?i)swimmers?"
  - "(?i)hikers?"
  - "(?i)runners?"
  - "(?i)travell?ers?"
  - "(?i)passengers?"
  - "(?i)teams?"
  - "(?i)users?"
  - "(?i)callers?"
  - "(?i)readers?"
  - "(?i)cats?"
  - "(?i)dogs?"
  - "(?i)birds?"
  - "(?i)robots?"
  # Vehicles and the physics register
  - "(?i)ships?"
  - "(?i)planes?"
  - "(?i)aircraft"
  - "(?i)trains?"
  - "(?i)bus(?:es)?"
  - "(?i)boats?"
  - "(?i)rockets?"
  - "(?i)probes?"
  - "(?i)missiles?"
  - "(?i)light"
  - "(?i)sound"
  - "(?i)waves?"
  - "(?i)heat"
  - "(?i)water"
  - "(?i)rivers?"
  - "(?i)roads?"
  - "(?i)temperatures?"
tokens:
  # --- Determiner-gated arrival: any artifact reaching a determined or
  # named object ("the catalog reached the store," "an orphan never
  # reaches an extractor," "the stage hasn't reached that record," "one
  # flag reaches INFO"), with an optional modifier, an optional auxiliary,
  # and an optional adverb inside the span. "Reaches for" and "reaches
  # out" stay with FigurativeReaches and ClosingPleasantries.
  - "\\b(?:a|an|the|this|that|these|those|each|every|its|their|both|all|one|any|some|no|only|most|two|three)\\s+(?:[a-z'-]+\\s+)?[a-z]+\\s+(?:never\\s+|ever\\s+|still\\s+|also\\s+|only\\s+|already\\s+|eventually\\s+|finally\\s+|actually\\s+|then\\s+|first\\s+|last\\s+|hasn't\\s+|haven't\\s+|hadn't\\s+|has\\s+|have\\s+|had\\s+|can't\\s+|cannot\\s+|won't\\s+|will\\s+|would\\s+|could\\s+|should\\s+|may\\s+|might\\s+|must\\s+|to\\s+|can\\s+|does\\s+|doesn't\\s+|did\\s+|didn't\\s+)?(?:actually\\s+|ever\\s+|never\\s+|still\\s+|also\\s+|only\\s+|yet\\s+)?reach(?:es|ed|ing)?\\s+(?!(?:for|out|zero|0|EOF|its\\s+end|the\\s+end|an\\s+end|end|capacity|its\\s+limit|a\\s+limit|the\\s+limit|steady|a\\s+fixed|its\\s+maximum|the\\s+maximum|its\\s+minimum|the\\s+minimum|a\\s+size|a\\s+length|a\\s+value|a\\s+certain|a\\s+threshold|the\\s+threshold|a\\s+point|the\\s+point|a\\s+state|a\\s+level|the\\s+level|a\\s+depth|the\\s+depth|a\\s+count|a\\s+total|the\\s+total|the\\s+top|the\\s+bottom|the\\s+root|the\\s+same|a\\s+leaf|the\\s+leaf|a\\s+node|the\\s+node|a\\s+null|nil|null|the\\s+target|its\\s+target|a\\s+target|a\\s+maximum|a\\s+minimum|the\\s+goal|its\\s+goal|the\\s+age|age|maturity|is|are|was|were|has|have|had|be|been|by|from|of|in|on|at|to|with|and|or|but|as|than|into|onto|via|through|over|under|after|before|when|if|unless|until|while|because|so|that|which|who|not|only|also|then|there|here|out|up|down|off|for|about|across|along|around|beyond|inside|outside|within|without|toward|towards|against|between|among|during|per|like|its|itself|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|fifty|hundred|thousand|million|several|many|more|fewer|less|enough|too|\\d+)\\b)(?:it|them|that|this|nothing|a|an|the|its|their|every|each|any|no|one|[a-z][a-z_]+)\\b"

  # --- The bare plural subject ("only referenced records reach the
  # store," "orphans reach nothing").
  - "\\b[a-z]+s\\s+(?:never\\s+|ever\\s+|still\\s+|also\\s+|only\\s+|already\\s+|eventually\\s+|finally\\s+|actually\\s+)?reach\\s+(?!(?:for|out|zero|0|EOF|its\\s+end|the\\s+end|an\\s+end|end|capacity|its\\s+limit|a\\s+limit|the\\s+limit|steady|a\\s+fixed|its\\s+maximum|the\\s+maximum|its\\s+minimum|the\\s+minimum|a\\s+size|a\\s+length|a\\s+value|a\\s+certain|a\\s+threshold|the\\s+threshold|a\\s+point|the\\s+point|a\\s+state|a\\s+level|the\\s+level|a\\s+depth|the\\s+depth|a\\s+count|a\\s+total|the\\s+total|the\\s+top|the\\s+bottom|the\\s+root|the\\s+same|a\\s+leaf|the\\s+leaf|a\\s+node|the\\s+node|a\\s+null|nil|null|the\\s+target|its\\s+target|a\\s+target|a\\s+maximum|a\\s+minimum|is|are|was|were|has|have|had|be|been|by|from|of|in|on|at|to|with|and|or|but|as|than|into|onto|via|through|over|under|after|before|when|if|unless|until|while|because|so|that|which|who|not|only|also|then|there|here|out|up|down|off|for|about|across|along|around|beyond|inside|outside|within|without|toward|towards|against|between|among|during|per|like|its|itself|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|fifty|hundred|thousand|million|several|many|more|fewer|less|enough|too|\\d+)\\b)(?:it|them|that|this|nothing|a|an|the|its|their|every|each|any|no|one|[a-z][a-z_]+)\\b"

  # --- The perfect and adverbial tokens with the subject out of view
  # ("has reached the store," "never reached it," "already reached that
  # record").
  - "\\b(?:has|have|hasn't|haven't|had|hadn't|never|ever|already|only|eventually|finally|actually)\\s+(?:not\\s+|never\\s+|already\\s+|yet\\s+|ever\\s+)?reached\\s+(?!(?:for|out|zero|0|EOF|its\\s+end|the\\s+end|an\\s+end|end|capacity|its\\s+limit|a\\s+limit|the\\s+limit|steady|a\\s+fixed|its\\s+maximum|the\\s+maximum|its\\s+minimum|the\\s+minimum|a\\s+size|a\\s+length|a\\s+value|a\\s+certain|a\\s+threshold|the\\s+threshold|a\\s+point|the\\s+point|a\\s+state|a\\s+level|the\\s+level|a\\s+depth|the\\s+depth|a\\s+count|a\\s+total|the\\s+total|the\\s+top|the\\s+bottom|the\\s+root|the\\s+same|a\\s+leaf|the\\s+leaf|a\\s+node|the\\s+node|a\\s+null|nil|null|the\\s+target|its\\s+target|a\\s+target|a\\s+maximum|a\\s+minimum|the\\s+goal|its\\s+goal|the\\s+age|age|maturity|is|are|was|were|has|have|had|be|been|by|from|of|in|on|at|to|with|and|or|but|as|than|into|onto|via|through|over|under|after|before|when|if|unless|until|while|because|so|that|which|who|not|only|also|then|there|here|out|up|down|off|for|about|across|along|around|beyond|inside|outside|within|without|toward|towards|against|between|among|during|per|like|its|itself|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|fifty|hundred|thousand|million|several|many|more|fewer|less|enough|too|\\d+)\\b)(?:it|them|that|this|nothing|a|an|the|its|their|every|each|any|no|one|[a-z][a-z_]+)\\b"

  # --- The object fronted: a relative clause that ends on the verb ("the
  # items a query reaches," "a record no extractor reaches"). The
  # lookbehind refuses the passive ("the timeout is reached"), which is
  # a measurement; three corpus hits remain ("statements that execution
  # can never reach").
  - "\\b(?:a|an|the|each|every|its|their|this|that|one|no)\\s+(?:[a-z'-]+\\s+)?(?!(?:is|are|was|were|be|been|being|get|gets|got|getting)\\b)[a-z]+\\s+(?:never\\s+|ever\\s+|still\\s+|also\\s+|only\\s+|already\\s+|actually\\s+|can\\s+|could\\s+|will\\s+|would\\s+|may\\s+|might\\s+|must\\s+|can't\\s+|cannot\\s+|won't\\s+)?reach(?:es|ed)?(?=[.,;:)]|$|\\s+(?:and|or|but|then|now|first|last|too|either)\\b)"
