---
extends: existence
message: "AI metacommentary: '%s'. Delete it or replace it with substantive content."
level: error
nonword: true
scope: raw
tokens:
  # "This [short noun] matters." - filler bridge sentences
  - "\\bThis\\s+\\w+\\s+matters\\."
  - "\\bThis\\s+\\w+\\s+\\w+\\s+matters\\."
  - "\\bThis\\s+\\w+\\s+\\w+\\s+\\w+\\s+matters\\."

  # "This matters because" variants
  - "\\bThis\\s+matters\\s+because\\b"
  - "\\bThis\\s+is\\s+important\\s+because\\b"
  - "\\bThis\\s+distinction\\s+matters\\b"
  - "\\bThis\\s+difference\\s+matters\\b"
  - "\\bThis\\s+framing\\s+matters\\b"
  - "\\bThis\\s+choice\\s+matters\\b"
  - "\\bThis\\s+detail\\s+matters\\b"
  - "\\bThis\\s+nuance\\s+matters\\b"
  - "\\bThis\\s+subtlety\\s+matters\\b"

  # The "Let me explain / Let's explore" explainer-prompt family is owned by
  # UnpackExplore.

  # "The key here is" / "The point is" filler
  - "\\bThe\\s+key\\s+here\\s+is\\b"
  - "\\bThe\\s+point\\s+here\\s+is\\b"
  - "\\bThe\\s+idea\\s+here\\s+is\\b"
  - "\\bThe\\s+insight\\s+here\\s+is\\b"
  # "The takeaway ... here is" is owned by StructureAnnouncements.
  - "\\bThe\\s+important\\s+thing\\s+here\\s+is\\b"

  # The "It's worth [verb]ing" hedged-assertion family is owned by
  # FigurativeWorth.

  # Bold callout phrases (in markdown)
  - "\\*\\*Key\\s+insight:?\\*\\*"
  - "\\*\\*Key\\s+takeaway:?\\*\\*"
  - "\\*\\*Key\\s+point:?\\*\\*"
  - "\\*\\*Important:?\\*\\*"
  - "\\*\\*Note:?\\*\\*"
  - "\\*\\*Bottom\\s+line:?\\*\\*"
  - "\\*\\*The\\s+point:?\\*\\*"

  # "This is the insight/key" framing. "This is the point" is PointVerdict's.
  - "\\bThis\\s+is\\s+the\\s+insight\\b"
  - "\\bThis\\s+is\\s+the\\s+key\\b"
  - "\\bThis\\s+is\\s+the\\s+takeaway\\b"
  - "\\bThis\\s+is\\s+the\\s+crucial\\b"
  - "\\bThis\\s+is\\s+the\\s+critical\\b"
  - "\\bThis\\s+is\\s+the\\s+important\\b"

  # "This enables/ensures/allows" consequence statements
  # Includes "This [noun] enables" and "This [noun] [noun] enables" variants
  - "\\bThis\\s+enables\\s+[^.]+\\."
  - "\\bThis\\s+\\w+\\s+enables\\s+[^.]+\\."
  - "\\bThis\\s+\\w+\\s+\\w+\\s+enables\\s+[^.]+\\."
  - "\\bThis\\s+ensures\\s+[^.]+\\."
  - "\\bThis\\s+\\w+\\s+ensures\\s+[^.]+\\."
  - "\\bThis\\s+allows\\s+[^.]+\\."
  - "\\bThis\\s+\\w+\\s+allows\\s+[^.]+\\."
  - "\\bThis\\s+provides\\s+[^.]+\\."
  - "\\bThis\\s+\\w+\\s+provides\\s+[^.]+\\."
  - "\\bThis\\s+gives\\s+you\\s+[^.]+\\."
  - "\\bThis\\s+\\w+\\s+gives\\s+you\\s+[^.]+\\."
  - "\\bThis\\s+means\\s+[^.]+\\."
  - "\\bThis\\s+\\w+\\s+means\\s+[^.]+\\."

  # "Understanding X enables/helps you" opener
  - "\\bUnderstanding\\s+[^.]+enables\\s+you\\s+to\\s+[^.]+\\."
  - "\\bUnderstanding\\s+[^.]+helps\\s+you\\s+[^.]+\\."
  - "\\bUnderstanding\\s+[^.]+allows\\s+you\\s+to\\s+[^.]+\\."

  # "Real-world" filler
  - "\\bReal-world\\s+[a-z]+"
  - "\\bIn\\s+the\\s+real\\s+world\\b"

  # "At its core/heart" framing
  - "\\bAt\\s+its\\s+core\\b"
  - "\\bAt\\s+its\\s+heart\\b"
  - "\\bAt\\s+its\\s+most\\s+basic\\b"
  - "\\bAt\\s+its\\s+most\\s+basic\\s+level\\b"
  - "\\bAt\\s+its\\s+most\\s+fundamental\\b"
  - "\\bAt\\s+its\\s+most\\s+fundamental\\s+level\\b"
  - "\\bAt\\s+its\\s+simplest\\b"
  - "\\bAt\\s+their\\s+core\\b"
  - "\\bAt\\s+their\\s+heart\\b"

  # "Think of X as" explanatory framing
  - "\\bThink\\s+of\\s+it\\s+as\\b"
  - "\\bThink\\s+of\\s+this\\s+as\\b"
  - "\\bThink\\s+of\\s+[^.]+as\\s+[^.]+\\."

  # "This is where" pivot phrases
  - "\\bThis\\s+is\\s+where\\s+it\\s+gets\\s+interesting\\b"
  - "\\bThis\\s+is\\s+where\\s+things\\s+get\\s+interesting\\b"
  - "\\bThis\\s+is\\s+where\\s+[^.]+\\s+comes\\s+in\\b"
  - "\\bThat'?s\\s+where\\s+[^.]+\\s+comes\\s+in\\b"
