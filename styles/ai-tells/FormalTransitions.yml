---
extends: existence
message: "AI transition: '%s'. Delete it, or use a simpler connector like 'and', 'but', or 'so'."
level: error
ignorecase: true
tokens:
  - Moreover
  - Furthermore
  - Additionally
  - Consequently
  - Subsequently
  - Nevertheless
  - Nonetheless
  - Conversely
  - Accordingly
  - Hence
  - Thus
  - Therefore
  - Thereby
  - Henceforth
  - Likewise
  - Similarly
  - In\s+addition
  - In\s+contrast
  - On\s+the\s+contrary
  - By\s+contrast
  - As\s+a\s+result
  - For\s+instance
  - For\s+example
  - In\s+particular
  # Pure degree/manner adverbs flag only as sentence-initial transitions with a
  # trailing comma; mid-sentence senses ("runs significantly faster",
  # "specifically designed for") are not the transition tell.
  - '^Specifically(?=,)'
  - Notably
  - Importantly
  - '^Significantly(?=,)'
  - Crucially
  - '^Essentially(?=,)'
  - '^Fundamentally(?=,)'
  - With\s+that\s+in\s+mind
  - With\s+this\s+in\s+mind
  - To\s+that\s+end
  - In\s+turn
  - Building\s+on\s+this
  - Building\s+on\s+that
  - That's\s+why
  - This\s+is\s+why
  - Which\s+is\s+why
  - That's\s+because
  - This\s+is\s+because
  - What's\s+more
  - What\s+is\s+more
  - Not\s+to\s+mention
  - To\s+that\s+point
  - On\s+that\s+note
  - On\s+a\s+related\s+note
  - Case\s+in\s+point
  - A\s+case\s+in\s+point
  # Anchored sentence-initial: the bare opener is the tell, but mid-sentence
  # "a point of note" is not. "Worth noting" in any position belongs to
  # FigurativeWorth.
  - '^Of\s+note'
  - Along\s+the\s+same\s+lines
  - In\s+the\s+same\s+vein
  - By\s+extension
  - To\s+top\s+it\s+off
  - That's\s+not\s+all
  - Better\s+yet
  - Even\s+better
  - Equally\s+important
  - Equally\s+crucial
  - Equally\s+significant
  - That\s+is\s+to\s+say
  - In\s+light\s+of\s+this
  - In\s+light\s+of\s+that
  - Given\s+this
  - Given\s+that
  - Given\s+the\s+above
