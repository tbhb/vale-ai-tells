---
extends: existence
message: "AI pseudo-cleft: '%s'. Put the claim first as its own sentence and delete the 'What ... is' frame."
level: error
nonword: true
# The pseudo-cleft: a free relative as subject, a copula, then the claim
# ("What changed is the direction," "What you get is one row per blob,"
# "What remains is the offset," "All you need is the offset," "The only
# thing that changes is the direction," "Where this pays off is the read
# path"). The frame spends five or six words announcing that a claim is
# coming, then delivers a claim short enough to have stood alone. It is
# the sibling of the "Here's what" lead in ExplainerLeads with the
# demonstrative dropped, and the model reaches for it once the
# announcing spellings are suppressed (2026-09).
#
# The plain form puts the claim first: "The direction changes." "Each
# blob gets one row." "The offset is all you need."
#
# ExplainerLeads takes the determiner-fronted spelling ("What the join
# does is," "What this buys is," "Why this works is"), RestatementMarkers
# "What this means is," ContrastiveFormulas "What matters is not," and
# ColloquialAssessments "all that matters" and "the only thing that
# matters," so the tokens here take the rest: the pronoun subject and the
# bare verb after "What," the "All" and "The only" quantifier frames, and
# "Where" with a verb of payoff. Every "What" token carries a lookahead
# that refuses a sentence ending in a question mark, which keeps "What
# value is the default?" out, and the word after the copula has to be a
# determiner, a quantifier, "that," "to," or a wh-word, which keeps the
# predicate adjective ("What remains is unclear") out. "What" and "Where"
# stay sentence-initial; "all" and "the only" match mid-sentence too,
# because "if all you want is a unique ID" is the same frame.
#
# Costs across the Go and Python standard libraries: the pronoun subject
# two ("What we want to happen is that"), the bare verb four ("What
# remains is the question of where to schedule the spill," "What makes the
# arenas here safe is that"), the "all" frame twelve ("All we need is the
# variable," "all you need to do is to derive a class"), its bare-verb
# spelling three ("all it does is call fn"), the "the only"
# frame seven ("The only thing that needs evaluating is the index"), and
# "Where" zero. Every hit is the construction itself and fires by design.
# The corpus lines break mid-sentence, so the longer tokens undercount.
tokens:
  # --- The pronoun subject ("What you get is one row per blob," "What we
  # need is the offset," "What it comes down to is a lookup"). "What I mean
  # is" stays in RestatementMarkers.
  - "\\bWhat(?![^.!?\\n]*\\?)\\s+(?!I\\s+mean\\s+is\\b)(?:you|we|they|it|one|I)\\s+(?:[a-z'-]+\\s+){1,5}(?:is|are|was|were|comes\\s+down\\s+to)\\s+(?:the|a|an|this|that|these|those|its|their|your|our|my|one|two|three|four|five|six|seven|eight|nine|ten|\\d+|some|any|all|every|each|nothing|something|anything|everything|another|both|either|enough|just|simply|only|to|whether|how|why|what|where|when|which|who)\\b"

  # --- The bare verb ("What changed is the direction," "What remains is
  # the offset," "What follows is the reverse lookup," "What makes this
  # work is the hash," "What matters here is the offset"). "What really
  # matters" and "What matters most" stay in ColloquialAssessments.
  - "\\bWhat(?![^.!?\\n]*\\?)\\s+(?!(?:really|truly|actually|genuinely)\\s+matters\\b)(?!matters\\s+most\\b)(?:actually\\s+|really\\s+|ultimately\\s+|finally\\s+|mostly\\s+|mainly\\s+|truly\\s+)?(?:changed|changes|remains|remained|follows|followed|matters|mattered|happens|happened|works|worked|differs|differed|varies|varied|counts|counted|stays|stayed|survives|survived|breaks|broke|fails|failed|holds|held|emerges|emerged|results|resulted|comes|came|goes|went|gets|got|helps|helped|hurts|hurt|drives|drove|limits|limited|blocks|blocked|ships|shipped|lands|landed|moved|shifted|grew|shrank|improved|stands\\s+out|stood\\s+out|sets\\s+[a-z]+\\s+apart|set\\s+[a-z]+\\s+apart|makes\\s+[a-z]+\\s+[a-z]+|made\\s+[a-z]+\\s+[a-z]+|distinguishes|distinguished|separates|separated|surprised\\s+[a-z]+|struck\\s+[a-z]+|bothers\\s+[a-z]+|bothered\\s+[a-z]+|scales|scaled|wins|won|pays\\s+off|paid\\s+off|ends\\s+up\\s+[a-z]+|ended\\s+up\\s+[a-z]+|turns\\s+out|turned\\s+out|took|takes|costs?|saves|saved)\\s+(?:[a-z'-]+\\s+){0,4}(?:is|are|was|were|comes\\s+down\\s+to)\\s+(?:the|a|an|this|that|these|those|its|their|your|our|my|one|two|three|four|five|six|seven|eight|nine|ten|\\d+|some|any|all|every|each|nothing|something|anything|everything|another|both|either|enough|just|simply|only|to|whether|how|why|what|where|when|which|who)\\b"

  # --- The "all" frame ("All that changes is the direction," "All you
  # need is the offset," "All that is required is a token," "all it does
  # is call the hook"). "All that matters" stays in ColloquialAssessments.
  - "\\b[Aa]ll\\s+(?!that\\s+(?:really\\s+|truly\\s+|actually\\s+)?matters\\b)(?:that|that's|you|we|they|it|this|one|I)\\s+(?:[a-z'-]+\\s+){1,4}(?:is|are|was|were)\\s+(?:the|a|an|this|that|these|those|its|their|your|our|my|one|two|three|four|five|six|seven|eight|nine|ten|\\d+|some|any|all|every|each|nothing|something|anything|everything|another|both|either|enough|just|simply|only|to|whether|how|why|what|where|when|which|who)\\b"
  - "\\b[Aa]ll\\s+(?:you|we|they|it|one|I)\\s+(?:do|does|did|have\\s+to\\s+do|need\\s+to\\s+do|had\\s+to\\s+do)\\s+is\\s+[a-z]+\\b"

  # --- The "the only" frame ("The only thing that changes is the
  # direction," "The only file you touch is the config," "the only
  # guarantee we have is that"). "The only thing that matters" stays in
  # ColloquialAssessments.
  - "\\b[Tt]he\\s+only\\s+(?:[a-z-]+\\s+){1,2}(?!that\\s+(?:really\\s+|truly\\s+|actually\\s+)?matters\\b)(?:that|which|you|we|they|it|I)\\s+(?:[a-z'-]+\\s+){1,4}(?:is|are|was|were)\\s+(?:the|a|an|this|that|these|those|its|their|your|our|my|one|two|three|four|five|six|seven|eight|nine|ten|\\d+|some|any|all|every|each|nothing|something|anything|everything|another|both|either|enough|just|simply|only|to|whether|how|why|what|where|when|which|who)\\b"

  # --- "Where" with a verb of payoff ("Where this pays off is the read
  # path," "Where it gets interesting is the cache"). The verb list keeps
  # the conditional "Where the input is a list," out.
  - "\\bWhere\\s+(?:this|that|it|things|the\\s+[a-z-]+)\\s+(?:really\\s+|actually\\s+)?(?:pays\\s+off|paid\\s+off|shines|shone|helps|helped|matters|counts|wins|won|breaks|broke|fails|failed|bites|hurts|differs|shows|showed|comes\\s+in|came\\s+in|gets\\s+[a-z]+|got\\s+[a-z]+|falls\\s+down|fell\\s+down|falls\\s+apart|goes\\s+wrong|went\\s+wrong|goes|went|ends\\s+up|ended\\s+up|lands|landed|starts|started|stops|stopped|lives|sits|hides|hid|happens|happened|changes|changed)\\s+(?:is|was)\\s+(?:the|a|an|this|that|these|those|its|their|your|our|my|one|two|three|four|five|six|seven|eight|nine|ten|\\d+|some|any|all|every|each|nothing|something|anything|everything|another|both|either|enough|just|simply|only|to|whether|how|why|what|where|when|which|who)\\b"
