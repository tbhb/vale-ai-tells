#:schema https://mise.jdx.dev/schema/mise.json
# The repo-specific half of the task and toolchain definitions. The shared
# half arrives through vendir as the vendored repotools payload: tool pins
# in .config/mise/conf.d/, tasks under .repotools/tasks/ selected by the
# task_config includes below. See vendir.yml.
#
# This is now the only task definition in the repository. The APM
# primitives under .claude/ spell their gates `mise run <task>` as of
# repotools v0.5.0, which is what let the delegation Justfile go.

[settings]
# Record resolved versions, URLs, and digests in a lockfile beside each
# config: mise.lock for this file, .config/mise/mise.lock for the vendored
# drop-ins. Both have to exist before mise will populate them; `lockfile =
# true` alone does not create either. Refresh both with:
#   mise lock --platform linux-x64,macos-arm64
lockfile = true

# Just ran [script] recipes under `bash -eu`. mise has no project-level
# counterpart: it defaults to `sh -c -o errexit`, and it refuses a
# `unix_default_inline_shell_args` override from a non-global config on
# security grounds. Every ported body that needs bash therefore opens with a
# shebang, which mise honors.
#
# Leaving it implicit would have hidden the difference until CI: macOS /bin/sh
# is bash in POSIX mode and tolerates [[ ]], while the ubuntu runners' /bin/sh
# is dash and does not.

# The toolchain now arrives through the vendored baseline drop-in at
# .config/mise/conf.d/10-repotools-tools.toml, which pins every tool the
# shared tasks invoke. This table holds only what this repository needs
# ahead of that payload, and any entry here overrides the same-named
# baseline pin -- root config beats conf.d, which is the consumer-override
# mechanism.
#
# Renovate's built-in mise manager reads this table and the conf.d
# drop-ins directly and needs no `# renovate:` markers: it derives the
# datasource from each backend and reads the lockfiles for the locked
# versions.
[tools]
# vendir cannot come from the payload it delivers, and the shared
# baseline deliberately omits it: bootstrap syncs before it installs, and
# a payload bump moves the very pins that sync writes. The pin lives
# here, ahead of the payload.
vendir = "0.46.1"

# The platform list this repository's two lockfiles cover. The shared
# repotools:check-toolchain task reads it for its failure hint.
[env]
REPOTOOLS_LOCK_PLATFORMS = "linux-x64,macos-arm64"

# The live half of the shared payload, selected file by file from the
# vendored .repotools/tasks directory. vendir delivers every task file;
# this table names the ones this repository takes -- today, all of them,
# including the drift gate the publisher itself cannot run.
[task_config]
includes = [
  ".repotools/tasks/fix.toml",
  ".repotools/tasks/format.toml",
  ".repotools/tasks/git-hooks.toml",
  ".repotools/tasks/lint.toml",
  ".repotools/tasks/pins.toml",
  ".repotools/tasks/preapproval.toml",
  ".repotools/tasks/security.toml",
  ".repotools/tasks/toolchain.toml",
  ".repotools/tasks/vendir.toml",
]

# --- Setup ---

# `depends` runs in parallel, so an ordered sequence has to be a run array.
# `vendir sync` runs first because the vendored conf.d drop-ins carry most
# of the tool pins the next step installs; mise re-reads config between
# steps, so the nested install sees pins the sync just delivered.
# install-tools then runs `vale sync` against the vale that step installs.
[tasks.bootstrap]
description = "Sync the vendored payload, set up the dev environment, and install git hooks"
alias = "setup"
run = [
  "vendir sync",
  "mise run install-toolchain",
  "mise run install-tools",
  "mise run repotools:prek-install",
]

[tasks.install-toolchain]
description = "Install the pinned toolchain from mise.toml and the vendored conf.d"
run = "mise install"

[tasks.install-tools]
description = "Refresh non-mise tooling (today: Vale's synced style packages)"
run = "vale sync"

# The lockfile gate is the shared repotools:check-toolchain task, whose
# failure hint reads REPOTOOLS_LOCK_PLATFORMS above.

# APM merges hook declarations into .claude/settings.json additively and
# never reconciles, while `apm audit --ci` replays the same merge from an
# empty tree and compares. A plain `apm install` therefore leaves two
# kinds of wreckage: a reordering the replay disagrees with forever, and
# entries for a hook upstream has since deleted, still firing. Clearing
# the keys APM owns first hands the merge the empty slate its replay
# assumes, so what lands is what the audit expects. Drop only the hooks
# key, so a hand-authored setting elsewhere in the file survives.
[tasks.apm-sync]
description = "Reinstall the APM primitives from a clean slate, then audit"
depends_post = ["lint-apm"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -f .claude/settings.json ]]; then
    jq 'del(.hooks)' .claude/settings.json > .claude/settings.json.tmp
    mv .claude/settings.json.tmp .claude/settings.json
fi
rm -f .claude/apm-hooks.json
apm install
'''

# --- Format ---
# The format and fix tasks (repotools:format-markdown, format-config,
# format-toml, fix-markdown) come from the vendored task files under
# .repotools/tasks/, selected above.

# --- Fix ---

# Some of a typical vale run needs no judgment: the rule's own action
# carries the correction, and the agent output template already prints
# it as replace_with= on the finding line. Reading those into a model so
# it can retype the answer spends tokens on a lookup. Only the Google
# and proselint rules define a replacement here -- the ai-tells styles
# describe what is wrong rather than substitute for it. This applies
# them and leaves the rest, refusing any finding whose span no longer
# holds the text the report quoted.
#
# The name and usage come from the skill-contract template in the
# vendored conf.d; the body stays local because the script is this
# repository's own.
[tasks.fix-prose-replacements]
extends = "repotools:fix-prose-replacements"
run = "bash tools/fix-prose-replacements.sh $usage_file"

# --- Lint ---

# A run array rather than `depends`: `depends` runs in parallel, which
# interleaves the findings from several linters into one unreadable stream.
# The agent output template exists to make a finding self-contained, and
# scrambling the order defeats it. actionlint is absent from the bar --
# the standalone lint-workflows workflow already covers it. The name comes
# from the skill-contract template; the member list is exactly what varies
# per repo, which is why the body stays local. The repotools: members are
# the vendored shared tasks, and the drift gate runs first so every gate
# after it reads a payload that matches the committed tree. check-pins
# follows it: both ask whether this repo's picture of repotools is
# current, and answering that before any linter runs says so in one line
# rather than through a confusing downstream failure.
[tasks.lint]
extends = "repotools:lint"
run = [
  "mise run repotools:check-vendored",
  "mise run repotools:check-pins",
  "mise run repotools:lint-yaml",
  "mise run repotools:lint-markdown",
  "mise run repotools:lint-config",
  "mise run repotools:lint-spelling",
  "mise run lint-prose",
  "mise run lint-messages",
  "mise run repotools:lint-toml",
  "mise run repotools:lint-mise",
  "mise run lint-editorconfig",
]

# Lint prose in Markdown via vale. Findings render through the agent
# template committed in this repo's StylesPath, so a fix never needs a
# second context-gathering pass. The test fixtures trip rules on
# purpose, and the generated CHANGELOG.md carries cog's Title-Case
# section headings, so both stay out of the walk. The apm* entries cover
# the APM manifest, lockfile, and gitignored package cache, none of which
# carry prose to lint.
[tasks.lint-prose]
extends = "repotools:lint-prose"
run = "vale --output=ai-tells-agent.tmpl --glob='!{LICENSE,CHANGELOG.md,test-*.md,styles/*,pkg/*,tmp/*,.claude/worktrees/*,.repotools/*,COMMIT_AGENTMSG,PR_AGENTDESC.md,SQUASH_AGENTMSG,apm.yml,apm.lock.yaml,apm_modules/*}' $usage_paths"

# Lint each rule file's own `message:` field with the ai-tells prose style, so
# the package's diagnostics don't contain the patterns they flag. Uses the
# RuleMessage View (styles/config/views/RuleMessage.yml) to select the field.
[tasks.lint-messages]
description = "Lint each rule's own message field with the ai-tells style"
run = "vale --config=.vale-messages.ini --output=ai-tells-agent.tmpl styles/ai-tells styles/ai-tells-commits styles/ai-tells-experimental"

# The lint-toml and lint-mise gates come from the vendored task files,
# alongside lint-yaml, lint-markdown, lint-config, lint-spelling, and the
# two pin tasks above.

# Enforce .editorconfig (charset, line endings, final newline, trailing
# whitespace, indentation) with editorconfig-checker. Nothing else in the bar
# reads .editorconfig, so without this the file is documentation for editors
# only. With no path args the checker walks the files git tracks, which
# already keeps it off the gitignored Vale style packages; the remaining
# scope lives in .editorconfig-checker.json, whose Exclude list also covers
# CHANGELOG.md -- `cog changelog` regenerates that file wholesale, and the
# prose tasks already skip it for the same reason. Indent width stays on
# tree-wide, and no file carries an inline exemption.
[tasks.lint-editorconfig]
description = "Enforce .editorconfig via editorconfig-checker"
run = "editorconfig-checker"

# Check the deployed APM primitives against the lockfile. Drift here
# means .claude/ and apm.lock.yaml disagree; `mise run apm-sync` is the fix.
# --no-policy skips the org policy lookup, which resolves to nothing on a
# personal account.
[tasks.lint-apm]
description = "Check the deployed APM primitives against apm.lock.yaml"
run = "apm audit --ci --no-policy"

# The two draft gates whose bodies are byte-identical across repos come
# whole from the skill-contract templates: name, interface, and body.
# prek needs .pre-commit-config.yaml staged to run.
[tasks.lint-commit-msg]
extends = "repotools:lint-commit-msg"

# Check a drafted pull request description. The validator settles the
# mechanical questions (frontmatter, title shape, the template's
# sections, paths that exist); vale and cspell then read the prose the
# same way they read any other Markdown in the tree.
[tasks.lint-pr-description]
extends = "repotools:lint-pr-description"
run = [
  "bash .claude/skills/pr/scripts/validate-description.sh",
  "vale --output=ai-tells-agent.tmpl PR_AGENTDESC.md",
  "cspell --config .cspell.jsonc --no-summary --no-progress PR_AGENTDESC.md",
]

# The squash message merge-pr writes never passes through git's commit-msg
# hook, because GitHub authors that commit rather than this machine. Running
# the same four hooks over the draft here is what keeps a squash commit
# answerable to the rules every other commit meets.
[tasks.lint-squash-msg]
extends = "repotools:lint-squash-msg"

# Every other prose task runs one checker over many files, so a document
# that clears `lint-prose` can still fail spelling and structure afterwards,
# which is how a short draft turns into four lint rounds. This runs vale,
# cspell, and rumdl over one document and reports all three at once.
#
# It also probes the path before trusting a clean run. Vale matches a path
# against the sections in .vale.ini exactly, and a path no section binds
# styles to loads no styles, reads the file, prints nothing, and exits 0 --
# byte for byte what a clean document produces. The script sends known-bad
# text through vale under the target's own path and reports an unscoped path
# rather than a pass.
[tasks.lint-draft]
extends = "repotools:lint-draft"
run = "bash tools/lint-draft.sh $usage_file"

# --- Test ---

[tasks.test]
description = "Run the fixture guard: tells fire, past-tense subjects smoke-test, no false positives"
run = [
  "mise run test-fires",
  "mise run test-commit-past-tense",
  "mise run test-figurative-owns-span",
  "mise run test-clean",
]

# Assert the tell corpus fires a healthy volume of errors under the test gate.
# .vale-test.ini binds ai-tells + ai-tells-experimental to test-document.md and
# ai-tells-commits to test-commit-messages.md at MinAlertLevel=error. The
# experimental rules ship at warning level, so only the error-level styles
# contribute here (ai-tells on the doc, ai-tells-commits on the commit corpus);
# the density metrics are validated separately. The floors catch a whole style
# silently ceasing to fire without pinning an exact count.
[tasks.test-fires]
description = "Assert the tell corpus fires a healthy volume of errors"
run = '''
#!/usr/bin/env bash
# Deliberately not -e: both counts are collected before either is judged.
set -uo pipefail
doc=$(vale --config=.vale-test.ini --output=JSON test-document.md | grep -c '"Severity": "error"' || true)
commit=$(vale --config=.vale-test.ini --output=JSON test-commit-messages.md | grep -c '"Severity": "error"' || true)
echo "test-document.md: $doc errors (ai-tells)"
echo "test-commit-messages.md: $commit errors (ai-tells-commits)"
fail=0
if [[ "$doc" -lt 400 ]]; then echo "FAIL: test-document.md fired $doc errors, expected at least 400"; fail=1; fi
if [[ "$commit" -lt 40 ]]; then echo "FAIL: test-commit-messages.md fired $commit errors, expected at least 40"; fail=1; fi
[[ "$fail" -eq 0 ]] && echo "Tell corpus fires as expected."
exit "$fail"
'''

# Smoke-test CommitPastTense on single-subject inputs. The rule's \A raw anchor
# only sees line 1, so the corpus fixture cannot exercise it. This feeds each
# documented subject through Vale on its own and checks the rule fires on
# past-tense or participle subjects and stays quiet on imperative ones.
[tasks.test-commit-past-tense]
description = "Smoke-test CommitPastTense on single-subject inputs"
run = '''
#!/usr/bin/env bash
# Deliberately not -e: every subject is checked before the result is judged.
set -uo pipefail
dir=$(mktemp -d)
cfg="$dir/smoke.ini"
subj="$dir/subject.md"
printf 'StylesPath = %s/styles\nMinAlertLevel = error\n[*]\nBasedOnStyles = ai-tells-commits\n' "$(pwd)" > "$cfg"
fail=0
check() {
  printf '%s\n' "$2" > "$subj"
  hits=$(vale --config="$cfg" --output=JSON "$subj" | grep -c 'CommitPastTense' || true)
  if [[ "$1" == fire && "$hits" -eq 0 ]]; then echo "FAIL (expected fire): $2"; fail=1
  elif [[ "$1" == clean && "$hits" -ne 0 ]]; then echo "FAIL (expected clean): $2"; fail=1
  else echo "ok ($1): $2"; fi
}
check fire 'Added rate limiting middleware'
check fire 'Fixed off-by-one in iterator'
check fire 'feat: Added rate limiting'
check fire 'fix(auth): Fixed session expiry'
check fire 'Refactoring the parser'
check clean 'Add rate limiting middleware'
check clean 'fix: Resolve race condition in scheduler'
check clean 'feat(auth): Drop legacy session check'
rm -rf "$dir"
[[ "$fail" -eq 0 ]] && echo "CommitPastTense smoke test passed."
exit "$fail"
'''

# Smoke-test FigurativeOwns' object-capture span. test-document.md's fire
# count can't catch a regression here: a truncated match still fires, just
# with the wrong span, so test-fires' floor stays green either way. This
# checks the actual matched text reaches the head noun instead of stopping
# at a hyphen or after one modifier word.
[tasks.test-figurative-owns-span]
description = "Smoke-test FigurativeOwns' object-capture span reaches the head noun"
run = '''
#!/usr/bin/env bash
# Deliberately not -e: every case is checked before the result is judged.
set -uo pipefail
dir=$(mktemp -d)
cfg="$dir/smoke.ini"
subj="$dir/subject.md"
printf 'StylesPath = %s/styles\nMinAlertLevel = error\n[*]\nBasedOnStyles = ai-tells\n' "$(pwd)" > "$cfg"
fail=0
check() {
  printf '%s\n' "$1" > "$subj"
  match=$(vale --config="$cfg" --output=JSON "$subj" \
    | jq -r '[.[][] | select(.Check=="ai-tells.FigurativeOwns")][0].Match // "<no match>"')
  if [[ "$match" == "$2" ]]; then echo "ok: $1"
  else echo "FAIL: $1"; echo "  expected: $2"; echo "  actual:   $match"; fail=1
  fi
}
check 'The installer owns the per-host registry.' \
  'owns the per-host registry'
check 'The service owns the shared configuration manifest.' \
  'owns the shared configuration manifest'
rm -rf "$dir"
[[ "$fail" -eq 0 ]] && echo "FigurativeOwns span smoke test passed."
exit "$fail"
'''

# The MDX fixture takes its own config. .vale-test-mdx.ini raises the
# raw-scope density rules to error, and vale applies a rule-level override
# globally, so those lines in .vale-test.ini would reach the other fixture.
[tasks.test-clean]
description = "Assert test-false-positives.md and test-mdx.md produce zero Vale errors"
quiet = true
run = '''
echo "Checking for false positives..."
vale --config=.vale-test.ini test-false-positives.md && vale --config=.vale-test-mdx.ini test-mdx.md && echo "Clean -- no false positives."
'''

# --- Package ---

# Build the three release zips. ai-tells-commits is style-only and zips flat.
# The other two take the wrapper shape (a top-level dir holding a styles/
# subtree) because each carries a file under styles/config that a flat zip
# has no room for: the agent output template in ai-tells, the Tengo scripts
# in ai-tells-experimental. Every file under styles/config ships from exactly
# one package, so the two copies can never diverge; the template used to ride
# along in ai-tells-experimental, which left it out of reach of a consumer
# syncing the core style alone. The project vocabulary and the dev-only
# message view stay out of both. pkg/ and the zips are gitignored build
# output.
[tasks.build-package]
description = "Build the three release zips"
run = '''
#!/usr/bin/env bash
set -euo pipefail
rm -rf pkg ai-tells.zip ai-tells-commits.zip ai-tells-experimental.zip
mkdir -p pkg/ai-tells/styles/config
cp -r styles/ai-tells pkg/ai-tells/styles/
cp -r styles/config/templates pkg/ai-tells/styles/config/
(cd pkg && zip -r ../ai-tells.zip ai-tells)
(cd styles && zip -r ../ai-tells-commits.zip ai-tells-commits)
mkdir -p pkg/ai-tells-experimental/styles
cp -r styles/ai-tells-experimental pkg/ai-tells-experimental/styles/
rsync -a --exclude='vocabularies/' --exclude='views/' --exclude='templates/' styles/config/ pkg/ai-tells-experimental/styles/config/
(cd pkg && zip -r ../ai-tells-experimental.zip ai-tells-experimental)
echo "Built ai-tells.zip, ai-tells-commits.zip, ai-tells-experimental.zip"
'''

# --- Rules ---

# The heredoc body is a Tera template, so the literal braces a Vale rule would
# carry need escaping. This one has none; a rule template that grows a `{{`
# needs a {% raw %} wrapper.
[tasks.scaffold]
description = "Scaffold a new rule file"
usage = 'arg "<name>"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
cat > "styles/ai-tells/${usage_name}.yml" << 'EOF'
---
extends: existence
message: "AI [type]: '%s'. [action]."
level: error
ignorecase: true
tokens:
  -
EOF
echo "Created styles/ai-tells/${usage_name}.yml"
'''

[tasks.stats]
description = "Show token counts per rule"
run = '''
#!/usr/bin/env bash
set -euo pipefail
echo "Token counts per rule (ai-tells):"
total=0
for f in styles/ai-tells/*.yml; do
  count=$(grep -c "^  - " "$f" 2>/dev/null || true)
  [[ -z "$count" ]] && count=0
  total=$((total + count))
  printf "  %-44s %3d\n" "$(basename "$f" .yml)" "$count"
done
echo ""
echo "  Subtotal: $total"
echo "  (Sequence rules report 1; actual verb count is higher)"
echo ""
echo "Token counts per rule (ai-tells-commits):"
commits_total=0
for f in styles/ai-tells-commits/*.yml; do
  count=$(grep -c "^  - " "$f" 2>/dev/null || true)
  [[ -z "$count" ]] && count=0
  commits_total=$((commits_total + count))
  printf "  %-44s %3d\n" "$(basename "$f" .yml)" "$count"
done
echo ""
echo "  Subtotal: $commits_total"
echo ""
echo "  Grand total: $((total + commits_total))"
'''

# --- Aggregators ---

# --- Corpus ---

# The pre-LLM prose corpora a candidate token is counted against before
# it lands. tools/corpus-build.sh explains the sources and the pins. The
# output lives in the cache, outside the repository.

[tasks.corpus-build]
description = "Build the pre-LLM prose corpora a new rule is measured against"
usage = 'flag "--force" help="Rebuild every corpus file even if it exists"'
run = "bash tools/corpus-build.sh ${usage_force:+--force}"

[tasks.corpus-grep]
description = "Count a PCRE pattern across every corpus, case-insensitive, with sample paragraphs"
usage = 'arg "<pattern>"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
dir="${VALE_AI_TELLS_CORPUS_DIR:-$HOME/.cache/vale-ai-tells/corpus}"
for f in "$dir"/*.txt; do
  printf '%-16s %s\n' "$(basename "$f" .txt)" "$(rg -icP -- "$usage_pattern" "$f" || echo 0)"
done
rg --no-filename -iP -- "$usage_pattern" "$dir"/*.txt | cut -c1-200 | head -n 8
'''

[tasks.check]
description = "Fast quality bar: lint then test"
run = ["mise run lint", "mise run test"]

# gitleaks arrives with the payload, which pins it alongside every other
# converted tool. No root pin here: a root entry would override the shared
# baseline, which is the duplication the move removes.
[tasks.check-all]
description = "Deeper bar: check plus the full-history gitleaks scan"
run = ["mise run check", "mise run repotools:gitleaks"]

# --- Utilities ---
# The prek entry points (repotools:prek, prek-all, prek-install) come
# from the vendored task files.

[tasks.vale-sync]
description = "Sync Vale styles and dictionaries"
run = "vale sync"

# --- Changelog ---

# Generate CHANGELOG.md from Conventional Commit history. cog 7 carries
# the tag's `v` prefix into version headings; strip it from the heading
# text (the compare URL keeps the tag name) so the release-notes
# extraction in release.yml and the update-release-notes task, both
# matching `## [X.Y.Z]`, find the section.
[tasks.generate-changelog]
description = "Generate CHANGELOG.md from Conventional Commit history"
run = "cog changelog | sed 's/^## \\[v/## [/' | { echo \"# Changelog\"; cat; } | rumdl check -d MD024 --fix --stdin > CHANGELOG.md"

[tasks.preview-changelog]
description = "Preview changelog since last release"
run = "cog changelog --at $(git describe --tags)..HEAD -t full_hash | rumdl check -d MD041 --fix --stdin"

[tasks.generate-release-notes]
description = "Generate release notes"
usage = 'arg "<version>" default=""'
run = '''
#!/usr/bin/env bash
set -euo pipefail
v=$([[ -n "$usage_version" ]] && echo "v$usage_version" || echo "..$(git rev-parse HEAD)")
cog changelog --at "$v" -t full_hash | rumdl check -d MD024,MD041 --isolated --fix --stdin
'''

# --- Release ---

[tasks.tag]
description = "Create an annotated release tag (e.g. mise run tag v1.5.0)"
usage = 'arg "<version>"'
run = 'git tag -a "$usage_version" -m "$usage_version"'

[tasks.update-release-notes]
description = "Extract the CHANGELOG entry for VERSION and update the GitHub release notes"
usage = 'arg "<version>"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
ver="$usage_version"
ver_no_v="${ver#v}"
repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
prev_tag=$(git describe --tags --abbrev=0 "${ver}^" 2>/dev/null || true)
notes=$(awk "/^## \\[${ver_no_v}\\]/{found=1; next} found && /^## \\[/{exit} found && /^<!-- vale/{next} found{print}" CHANGELOG.md \
  | awk 'BEGIN{b=1} /^[[:space:]]*$/{if(!b)printf "\n"; b=1; next} {b=0; print}')
if [[ -n "$prev_tag" ]]; then
  notes+=$'\n\n'"**Full Changelog**: https://github.com/${repo}/compare/${prev_tag}...${ver}"
fi
gh release edit "${ver}" --notes "${notes}"
echo "Release notes updated for ${ver}"
'''

[tasks.release]
description = "Tag, push, wait for the GitHub release workflow, then update release notes"
usage = 'arg "<version>"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="$usage_version"
mise run tag "$version"
echo "Pushing..."
git push && git push --tags
echo "Waiting for release workflow..."
run_id=""
for i in $(seq 1 30); do
  run_id=$(gh run list --workflow=release.yml --branch="$version" --limit=1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
  [[ -n "$run_id" ]] && break
  sleep 2
done
if [[ -z "$run_id" ]]; then
  echo "Error: no release workflow run found for $version after 60s"
  exit 1
fi
# `gh run watch --exit-status` reports success on a failed run, so poll
# the run's own status and conclusion instead of trusting its exit code.
status=""
conclusion=""
for i in $(seq 1 120); do
  read -r status conclusion <<< "$(gh run view "$run_id" --json status,conclusion -q '.status + " " + .conclusion')"
  [[ "$status" == "completed" ]] && break
  sleep 10
done
if [[ "$status" != "completed" ]]; then
  echo "Error: release run $run_id still $status after 20 minutes"
  exit 1
fi
if [[ "$conclusion" != "success" ]]; then
  echo "Error: release run $run_id concluded $conclusion"
  exit 1
fi
mise run update-release-notes "$version"
repo=$(gh repo view --json nameWithOwner -q .nameWithOwner)
echo "Done! https://github.com/${repo}/releases/tag/$version"
'''
