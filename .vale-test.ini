StylesPath = styles
MinAlertLevel = error

[test-false-positives.md]
BasedOnStyles = ai-tells, ai-tells-experimental
ai-tells-experimental.ContractionAvoidance = NO
ai-tells-experimental.SentenceStartRepetition = NO

# test-mdx.md answers to .vale-test-mdx.ini, which raises the raw-scope
# rules to error. That cannot live here: vale applies a rule-level
# override globally rather than per section, so the same lines would
# raise those rules over test-false-positives.md too.
